    ApiError:
      type: object
      additionalProperties: false
      required: [code, message_key, correlation_id]
      properties:
        code:
          type: string
          enum:
            [
              AUTHENTICATION_FAILED,
              AUTHORIZATION_DENIED,
              INPUT_INVALID,
              RESOURCE_NOT_FOUND,
              CONFLICT,
              RATE_LIMITED,
              UPSTREAM_UNAVAILABLE,
              INTERNAL_ERROR,
            ]
        message_key: { type: string }
        correlation_id: { type: string }
        details:
          type: object
          additionalProperties: true
  responses:
    BadRequest:
      description: 请求格式、严格 DTO、Header 或回调结构无效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthorized:
      description: 认证或供应商 MAC 失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: 当前管理员没有目标商城或动作权限
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: 当前主体和商城范围内不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: 版本、状态、金额、幂等、退款余额或活动运单冲突
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    RateLimited:
      description: 请求过多
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    UpstreamUnavailable:
      description: 供应商暂不可用；不泄露上游响应正文
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
