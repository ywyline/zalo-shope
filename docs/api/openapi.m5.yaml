openapi: 3.1.0
info:
  title: Zalo Shop M5 Payment, Refund, Shipping and Integration API
  version: 0.5.9-cod-reconciliation
  description: >-
    M5.5 已实施在线订单、支付尝试、异步 launch、provider-order 绑定、本人查询/重试、
    Zalo Checkout 主动查单和验签 webhook；M5.6 已实施 GHN 报价、运单命令、面单代理、
    权威轨迹查询和未签名 webhook hint。M5.7 已实施商城隔离的支付/退款列表、部分或全额
    退款命令、支付与退款主动查询、脱敏集成任务列表及受审 dead-letter 重放。P0-M5-005
    Slice A 已增加规范化支付/退款结算批次导入、脱敏列表和差异详情；它不解析供应商文件，
    不调用供应商，也不推进支付、退款、订单或库存状态。真实商户退款、结算文件、GHN COD
    回款和 Zalo 宿主验收仍为 BLOCKED/NOT_RUN。
    本文与 openapi.m1-m4.yaml 共同描述增量 API。
    支付采用 ZaloPay through Zalo Checkout，物流采用 GHN，两个商城使用独立渠道配置。
    客户端 Checkout/PaymentDone、供应商回调和 GHN webhook 均不能直接修改金额、库存或状态。
servers:
  - url: http://localhost:3000
tags:
  - { name: Online checkout }
  - { name: Member payments }
  - { name: Member shipping }
  - { name: Provider webhooks }
  - { name: Admin payments }
  - { name: Admin refunds }
  - { name: Admin financial reconciliation }
  - { name: Admin shipping }
  - { name: Admin integrations }
paths:
  /v1/checkout/orders:
    post:
      tags: [Online checkout]
      summary: 幂等创建 ONLINE 订单及首个支付尝试
      description: >-
        M5 对 M4 同路径的向后兼容扩展。服务端重验最终报价并在同一事务创建
        PENDING_PAYMENT 订单、库存预留、支付尝试和 launch outbox。请求仍拒绝
        store_id、金额、运费、库存、支付结果和供应商字段。
      security: [{ StoreCode: [], MemberBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/StoreCode'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OnlineCheckoutOrderRequest' }
      responses:
        '201':
          description: 在线订单及首个内部支付尝试；launch 由 outbox worker 异步准备
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnlineCheckoutOrderResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }
  /v1/orders/{orderId}/payments:
    post:
      tags: [Member payments]
      summary: 为本人仍在支付窗口的订单创建新支付尝试
      security: [{ StoreCode: [], MemberBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/StoreCode'
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '201':
          description: 新内部尝试；同订单最多一个活动尝试，launch 由 worker 异步准备
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentAttempt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }
  /v1/orders/{orderId}/payments/{paymentId}/provider-order:
    post:
      tags: [Member payments]
      summary: 绑定 Mini App createOrder 返回的 Checkout orderId 查单提示
      description: >-
        provider_order_id 来自不可信客户端，只用于触发服务端 getOrderStatus。只有服务端
        验证 amount、ZaloPay method 和签名 extradata 中的 attempt/order/nonce 后才写入绑定事实；
        本接口本身不能确认支付成功。
      security: [{ StoreCode: [], MemberBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/StoreCode'
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderOrderBindRequest' }
      responses:
        '201':
          description: 已接受查单提示
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentAttempt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }
  /v1/payments/{paymentId}:
    get:
      tags: [Member payments]
      summary: 查询本人订单的内部支付状态
      description: 客户端 PaymentDone/checkTransaction 只作提示；本响应仍以服务端事实为准。
      security: [{ StoreCode: [], MemberBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/StoreCode'
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: 当前标准支付状态及恢复建议
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentAttempt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/payments/{paymentId}/launch:
    get:
      tags: [Member payments]
      summary: 获取 worker 已准备且完整性校验通过的短期 Checkout 动作
      description: >-
        launch 由当前商城渠道选择的 provider 生成；test provider 仍只允许 NODE_ENV=test。
        返回 MAC 但不返回 Private Key、secret reference 或其他商城配置。
      security: [{ StoreCode: [], MemberBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/StoreCode'
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: 当前本人支付尝试的短期 launch；launch_token 只用于绑定 SDK 返回的 provider order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentLaunch' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }
  /v1/payments/{paymentId}/query:
    post:
      tags: [Member payments]
      summary: 主动查询本人支付尝试并提交统一支付事实命令
      description: >-
        按当前商城渠道调用 Zalo Checkout getOrderStatus；SDK 客户端结果不作为支付成功事实。
        查询响应仍需核对商城、订单、尝试、method、extradata、整数 VND 金额和内部状态。
      security: [{ StoreCode: [], MemberBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/StoreCode'
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '201':
          description: 已查询并返回当前内部标准状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentAttempt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }
  /v1/orders/{orderId}/shipment:
    get:
      tags: [Member shipping]
      summary: 查询本人订单的运单及三语可映射轨迹
      security: [{ StoreCode: [], MemberBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/StoreCode'
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: 当前活动/历史运单；不返回 GHN Token、ShopId 或原始地址
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberShipmentEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/webhooks/payments/zalo-checkout:
    post:
      tags: [Provider webhooks]
      summary: 接收 Zalo Checkout 支付结果
      description: >-
        使用原始字段和商城独立 Checkout Private Key 校验 HmacSHA256 mac；存在扩展字段时同时
        校验 overallMac。IP 仅为附加 allowlist。验签后仍核对 App、商城、订单、VND 金额、
        ZaloPay method、extradata 和状态；重复/乱序事件幂等。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ZaloCheckoutCallback' }
      responses:
        '200':
          description: 已处理或幂等接受
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookAcknowledgement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: MAC 无效；不返回候选商城或订单信息
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }
  /v1/webhooks/shipping/ghn:
    post:
      tags: [Provider webhooks]
      summary: 接收 GHN 未签名的运单同步提示
      description: >-
        GHN 当前官方 webhook 契约没有签名字段。本路由只解析、去重并调度对应商城 GHN
        Order Info 主动查询；请求内 Status、Fee、CODAmount 等永不直接推进内部状态或金额。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GhnWebhookHint' }
      responses:
        '202':
          description: 提示已接受或幂等忽略，后续以主动查单为准
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookAcknowledgement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/admin/payments:
    get:
      tags: [Admin payments]
      summary: 分页查询目标商城支付尝试
      security: [{ StoreCode: [], AdminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/StoreCode'
        - $ref: '#/components/parameters/StoreIdQuery'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: order_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/PaymentAttemptStatus' }
      responses:
        '200':
          description: 当前商城支付页；供应商引用已掩码
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/admin/payments/{paymentId}/query:
    post:
      tags: [Admin payments]
      summary: 受审触发 Zalo Checkout 主动查单
      security: [{ StoreCode: [], AdminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/StoreCode'
        - $ref: '#/components/parameters/StoreIdQuery'
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderQueryRequest' }
      responses:
        '202':
          description: 已调度；不接受管理员自报支付结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/admin/payments/{paymentId}/refunds:
    post:
      tags: [Admin refunds]
      summary: 创建部分或全额退款
      description: >-
        服务端锁定支付和退款事实重算可退款余额；不接受 provider refund ID、成功状态或库存动作。
      security: [{ StoreCode: [], AdminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/StoreCode'
        - $ref: '#/components/parameters/StoreIdQuery'
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefundCreateRequest' }
      responses:
        '202':
          description: 已创建退款事实并调度供应商命令
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/admin/refunds:
    get:
      tags: [Admin refunds]
      summary: 分页查询目标商城退款
      security: [{ StoreCode: [], AdminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/StoreCode'
        - $ref: '#/components/parameters/StoreIdQuery'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: order_id
          in: query
          schema: { type: string, format: uuid }
        - name: payment_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/RefundStatus' }
      responses:
        '200':
          description: 当前商城退款页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/admin/refunds/{refundId}/query:
    post:
      tags: [Admin refunds]
      summary: 受审触发 Checkout 退款状态查询
      security: [{ StoreCode: [], AdminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/StoreCode'
        - $ref: '#/components/parameters/StoreIdQuery'
        - $ref: '#/components/parameters/RefundId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderQueryRequest' }
      responses:
        '202':
          description: 已调度
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/admin/financial-reconciliation/payment-batches:
    post:
      tags: [Admin financial reconciliation]
      summary: 导入规范化支付/退款结算批次
      description: >-
        仅接受财务已复核的规范化逐笔输入。服务端按目标商城和支付渠道匹配已有支付/退款事实，
        计算整数 VND 毛额、手续费、带方向净额、本地预期与差异，并原子追加批次、逐笔和脱敏审计。
        需要直接商城角色、近期 MFA、固定确认码、原因和幂等键；不能仅凭平台跨商城权限写入。
        本接口不解析 ZaloPay 文件、不发起供应商请求，也不改变任何业务状态。
      security: [{ StoreCode: [], AdminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/StoreCode'
        - $ref: '#/components/parameters/StoreIdQuery'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentSettlementBatchImportRequest' }
      responses:
        '201':
          description: 已原子追加批次；同键同请求重放返回 replayed=true
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinancialReconciliationImportResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/admin/financial-reconciliation/cod-batches:
    post:
      tags: [Admin financial reconciliation]
      summary: 导入规范化 GHN COD 回款批次
      description: >-
        仅接受财务已复核的规范化 GHN COD 回款、运费和 COD 费用输入。服务端按目标商城、GHN
        物流渠道、订单出库运单和创建运单前的可信报价匹配，分类金额、费用、终态、非应收、缺失和
        重复异常，并原子追加脱敏事实。接口不解析供应商文件、不发起 GHN 请求、不确认真实资金到账，
        也不改变订单、运单、支付、库存或现金状态。
      security: [{ StoreCode: [], AdminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/StoreCode'
        - $ref: '#/components/parameters/StoreIdQuery'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CodRemittanceBatchImportRequest' }
      responses:
        '201':
          description: 已原子追加批次；同键同请求重放返回 replayed=true
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinancialReconciliationImportResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/admin/financial-reconciliation/cod-receivables:
    get:
      tags: [Admin financial reconciliation]
      summary: 分页读取目标商城 COD 应收投影
      description: >-
        只投影当前商城 GHN、ORDER_OUTBOUND、COD 且已签收的可信运单，并使用运单创建前同渠道、
        同订单、同服务的最近 provider 报价计算预期费用。状态筛选在稳定游标分页前生效；返回引用
        始终为公开运单号或掩码，不代表供应商或银行已确认资金到账。
      security: [{ StoreCode: [], AdminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/StoreCode'
        - $ref: '#/components/parameters/StoreIdQuery'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/CodReceivableStatus' }
      responses:
        '200':
          description: 当前商城 COD 应收页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodReceivablePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/admin/financial-reconciliation/batches:
    get:
      tags: [Admin financial reconciliation]
      summary: 分页读取目标商城财务对账批次
      description: >-
        只返回批次引用掩码和整数 VND 汇总。平台跨商城只读仍需显式目标商城与访问原因；
        游标按 created_at、id 稳定倒序推进。
      security: [{ StoreCode: [], AdminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/StoreCode'
        - $ref: '#/components/parameters/StoreIdQuery'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: source
          in: query
          schema: { type: string, enum: [PAYMENT_PROVIDER, SHIPPING_PROVIDER] }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/FinancialReconciliationBatchStatus' }
        - name: business_date_from
          in: query
          schema: { type: string, format: date }
        - name: business_date_to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: 当前商城批次页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinancialReconciliationBatchPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/admin/financial-reconciliation/batches/{batchId}:
    get:
      tags: [Admin financial reconciliation]
      summary: 读取目标商城财务对账批次及逐笔差异
      security: [{ StoreCode: [], AdminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/StoreCode'
        - $ref: '#/components/parameters/StoreIdQuery'
        - name: batchId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 批次与逐笔差异；记录和供应商引用只返回掩码
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinancialReconciliationBatchDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/admin/shipping/quotes:
    post:
      tags: [Admin shipping]
      summary: 从订单可信事实获取 GHN 报价
      security: [{ StoreCode: [], AdminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/StoreCode'
        - $ref: '#/components/parameters/StoreIdQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShippingQuoteRequest' }
      responses:
        '201':
          description: 可解释、带过期时间的 GHN 整数 VND 报价
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShippingQuote' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }
  /v1/admin/inventory/administrative-areas:
    get:
      tags: [Admin shipping]
      summary: 读取当前商城仓库履约可选行政区
      security: [{ StoreCode: [], AdminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/StoreCode'
        - $ref: '#/components/parameters/StoreIdQuery'
        - name: level
          in: query
          required: true
          schema: { type: string, enum: [PROVINCE, DISTRICT, WARD] }
        - name: parent_code
          in: query
          schema:
            type: string
            minLength: 2
            maxLength: 64
            pattern: '^[a-z][a-z0-9-]*$'
      responses:
        '200':
          description: 当前商城启用行政区；区/坊必须使用父级 code 查询
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdministrativeAreaPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/admin/inventory/warehouses/{warehouseId}/fulfillment-profile:
    put:
      tags: [Admin shipping]
      summary: 创建或替换加密仓库履约资料
      description: >-
        需要近期 MFA 和 store.inventory.manage。联系人、电话和详细地址完整替换并加密保存，
        响应只返回完整性、地区、启用状态和版本。
      security: [{ StoreCode: [], AdminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/StoreCode'
        - $ref: '#/components/parameters/StoreIdQuery'
        - name: warehouseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseFulfillmentProfileInput' }
      responses:
        '200':
          description: 已受审保存；不回显敏感原文
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseFulfillmentProfileView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/admin/orders/{orderId}/shipments:
    post:
      tags: [Admin shipping]
      summary: 为待履约订单幂等创建唯一活动 GHN 运单
      security: [{ StoreCode: [], AdminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/StoreCode'
        - $ref: '#/components/parameters/StoreIdQuery'
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShipmentCreateRequest' }
      responses:
        '202':
          description: 已创建 CREATION_PENDING 运单并调度 GHN 建单
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShipmentCommand' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/admin/shipments/{shipmentId}/cancel:
    post:
      tags: [Admin shipping]
      summary: 请求取消允许取消的 GHN 运单
      security: [{ StoreCode: [], AdminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/StoreCode'
        - $ref: '#/components/parameters/StoreIdQuery'
        - $ref: '#/components/parameters/ShipmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShipmentCancelRequest' }
      responses:
        '202':
          description: 已调度；本地请求不伪造供应商取消成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShipmentCommand' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/admin/shipments/{shipmentId}/sync:
    post:
      tags: [Admin shipping]
      summary: 主动查询 GHN Order Info 并规范化轨迹
      security: [{ StoreCode: [], AdminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/StoreCode'
        - $ref: '#/components/parameters/StoreIdQuery'
        - $ref: '#/components/parameters/ShipmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShipmentSyncRequest' }
      responses:
        '202':
          description: 已调度权威查单
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShipmentCommand' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/admin/shipments/{shipmentId}/label:
    get:
      tags: [Admin shipping]
      summary: 获取受审短期 GHN 面单访问
      security: [{ StoreCode: [], AdminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/StoreCode'
        - $ref: '#/components/parameters/StoreIdQuery'
        - $ref: '#/components/parameters/ShipmentId'
        - name: format
          in: query
          schema:
            type: string
            enum: [A5, THERMAL_80X80, THERMAL_52X70]
            default: A5
      responses:
        '200':
          description: 短期、private/no-store 访问；不暴露 GHN Token
          headers:
            Cache-Control:
              schema: { type: string, const: 'private, no-store' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LabelAccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }
  /v1/admin/orders/{orderId}/shipment:
    get:
      tags: [Admin shipping]
      summary: 查询当前商城订单的脱敏运单与轨迹
      security: [{ StoreCode: [], AdminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/StoreCode'
        - $ref: '#/components/parameters/StoreIdQuery'
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: 运单不存在时 shipment 为 null；不返回完整供应商引用或地址
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminShipmentEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/shipping/labels/{token}:
    get:
      tags: [Admin shipping]
      summary: 使用短期内部 token 代理 GHN A5 PDF 面单
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 4096 }
      responses:
        '200':
          description: 固定 GHN origin/path、禁止 redirect 且限制 8 MiB 的 PDF 流
          headers:
            Cache-Control:
              schema: { type: string, const: 'private, no-store' }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }
  /v1/admin/integration-jobs:
    get:
      tags: [Admin integrations]
      summary: 查询当前商城外部任务的脱敏状态
      security: [{ StoreCode: [], AdminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/StoreCode'
        - $ref: '#/components/parameters/StoreIdQuery'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, PROCESSING, SUCCEEDED, RETRY_WAIT, DEAD_LETTER]
      responses:
        '200':
          description: 不含原始 payload、密钥、Token 或完整 PII
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationJobPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/admin/integration-jobs/{jobId}/retry:
    post:
      tags: [Admin integrations]
      summary: 受审重试当前商城 dead-letter 任务
      description: 不能修改 payload、aggregate、store、provider 或 environment。
      security: [{ StoreCode: [], AdminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/StoreCode'
        - $ref: '#/components/parameters/StoreIdQuery'
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IntegrationJobRetryRequest' }
      responses:
        '202':
          description: 已追加重试命令
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    StoreCode:
      type: apiKey
      in: header
      name: X-Store-Code
    MemberBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    AdminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    StoreCode:
      name: X-Store-Code
      in: header
      required: true
      schema: { type: string, minLength: 2, maxLength: 64 }
    StoreIdQuery:
      name: store_id
      in: query
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[!-~]+$' }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RefundId:
      name: refundId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ShipmentId:
      name: shipmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  schemas:
    OnlineCheckoutOrderRequest:
      type: object
      additionalProperties: false
      required: [address_id, items, payment_method, quote_hash]
      properties:
        address_id: { type: string, format: uuid }
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [sku_code, quantity]
            properties:
              sku_code: { type: string, minLength: 1, maxLength: 64 }
              quantity: { type: integer, minimum: 1, maximum: 99 }
        coupon_code: { type: [string, 'null'], maxLength: 64, default: null }
        locale: { type: string, enum: [vi, zh, en], default: vi }
        payment_method: { type: string, const: ONLINE }
        quote_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
    OnlineCheckoutOrderResult:
      type: object
      additionalProperties: false
      required:
        [id, order_number, status, payment_method, payment_status, payable_vnd, payment_attempt_id]
      properties:
        id: { type: string, format: uuid }
        order_number: { type: string }
        status: { type: string, const: PENDING_PAYMENT }
        payment_method: { type: string, const: ONLINE }
        payment_status: { type: string, const: PENDING }
        payable_vnd: { type: integer, minimum: 1, maximum: 9007199254740991 }
        payment_attempt_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    PaymentLaunch:
      type: object
      additionalProperties: false
      required: [payment_id, kind, expires_at, launch_token, payload]
      properties:
        payment_id: { type: string, format: uuid }
        kind: { type: string, const: ZALO_CHECKOUT_CREATE_ORDER }
        expires_at: { type: string, format: date-time }
        launch_token: { type: string, minLength: 32, maxLength: 4096 }
        payload:
          type: object
          additionalProperties: false
          required: [amount, desc, item, extradata, method, mac]
          properties:
            amount: { type: integer, minimum: 1, maximum: 9007199254740991 }
            desc: { type: string, minLength: 1, maxLength: 256 }
            item:
              type: array
              description: SDK 接收数组；服务端生成 MAC 时使用该数组的 JSON String
              items:
                type: object
                additionalProperties: false
                required: [id, amount]
                properties:
                  id: { type: string, minLength: 1, maxLength: 128 }
                  amount: { type: integer, minimum: 0, maximum: 9007199254740991 }
            extradata: { type: string, description: 与 MAC 完全一致的 JSON String }
            method:
              type: string
              enum:
                - '{"id":"ZALOPAY_SANDBOX","isCustom":false}'
                - '{"id":"ZALOPAY","isCustom":false}'
            mac: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
    ProviderOrderBindRequest:
      type: object
      additionalProperties: false
      required: [provider_order_id, launch_token]
      properties:
        provider_order_id: { type: string, minLength: 1, maxLength: 160 }
        launch_token: { type: string, minLength: 32, maxLength: 4096 }
    PaymentSettlementRecord:
      type: object
      additionalProperties: false
      required:
        [type, record_reference, provider_reference, occurred_at, gross_amount_vnd, fee_amount_vnd]
      properties:
        type: { type: string, enum: [PAYMENT, REFUND] }
        record_reference: { type: string, minLength: 1, maxLength: 160 }
        provider_reference: { type: string, minLength: 1, maxLength: 160 }
        occurred_at: { type: string, format: date-time }
        gross_amount_vnd: { type: integer, minimum: 1, maximum: 9007199254740991 }
        fee_amount_vnd: { type: integer, minimum: 0, maximum: 9007199254740991 }
    PaymentSettlementBatchImportRequest:
      type: object
      additionalProperties: false
      required:
        [
          batch_reference,
          business_date,
          provider_code,
          provider_environment,
          confirmation_code,
          reason,
          records,
        ]
      properties:
        batch_reference: { type: string, minLength: 1, maxLength: 160 }
        business_date: { type: string, format: date }
        provider_code: { type: string, const: ZALO_CHECKOUT_ZALOPAY }
        provider_environment: { type: string, enum: [SANDBOX, PRODUCTION] }
        confirmation_code: { type: string, const: IMPORT_PAYMENT_SETTLEMENT }
        reason: { type: string, minLength: 10, maxLength: 500 }
        records:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/PaymentSettlementRecord' }
    CodRemittanceRecord:
      type: object
      additionalProperties: false
      required:
        [
          record_reference,
          provider_reference,
          occurred_at,
          cod_amount_vnd,
          shipping_fee_vnd,
          cod_fee_vnd,
        ]
      properties:
        record_reference: { type: string, minLength: 1, maxLength: 160 }
        provider_reference: { type: string, minLength: 1, maxLength: 160 }
        occurred_at: { type: string, format: date-time }
        cod_amount_vnd: { type: integer, minimum: 1, maximum: 9007199254740991 }
        shipping_fee_vnd: { type: integer, minimum: 0, maximum: 9007199254740991 }
        cod_fee_vnd: { type: integer, minimum: 0, maximum: 9007199254740991 }
    CodRemittanceBatchImportRequest:
      type: object
      additionalProperties: false
      required:
        [
          batch_reference,
          business_date,
          provider_code,
          provider_environment,
          confirmation_code,
          reason,
          records,
        ]
      properties:
        batch_reference: { type: string, minLength: 1, maxLength: 160 }
        business_date: { type: string, format: date }
        provider_code: { type: string, const: GHN }
        provider_environment: { type: string, enum: [SANDBOX, PRODUCTION] }
        confirmation_code: { type: string, const: IMPORT_GHN_COD_SETTLEMENT }
        reason: { type: string, minLength: 10, maxLength: 500 }
        records:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/CodRemittanceRecord' }
    FinancialReconciliationBatchStatus:
      type: string
      enum: [MATCHED, REVIEW_REQUIRED]
    FinancialReconciliationLineStatus:
      type: string
      enum:
        [
          MATCHED,
          AMOUNT_MISMATCH,
          FEE_MISMATCH,
          REFERENCE_NOT_FOUND,
          FACT_NOT_FINAL,
          COD_NOT_RECEIVABLE,
          EXPECTED_FEE_NOT_FOUND,
          DUPLICATE_REFERENCE,
        ]
    FinancialReconciliationLine:
      type: object
      additionalProperties: false
      required:
        [
          id,
          line_number,
          type,
          status,
          record_reference_masked,
          provider_reference_masked,
          occurred_at,
          gross_amount_vnd,
          fee_amount_vnd,
          net_amount_vnd,
          local_expected_amount_vnd,
          difference_vnd,
          local_expected_fee_amount_vnd,
          fee_difference_vnd,
        ]
      properties:
        id: { type: string, format: uuid }
        line_number: { type: integer, minimum: 1, maximum: 500 }
        type: { type: string, enum: [PAYMENT, REFUND, COD_REMITTANCE] }
        status: { $ref: '#/components/schemas/FinancialReconciliationLineStatus' }
        record_reference_masked: { type: string, minLength: 1, maxLength: 160 }
        provider_reference_masked: { type: string, minLength: 1, maxLength: 160 }
        occurred_at: { type: string, format: date-time }
        gross_amount_vnd: { type: integer, minimum: 1, maximum: 9007199254740991 }
        fee_amount_vnd: { type: integer, minimum: 0, maximum: 9007199254740991 }
        net_amount_vnd: { type: integer, minimum: -9007199254740991, maximum: 9007199254740991 }
        local_expected_amount_vnd:
          type: [integer, 'null']
          minimum: 0
          maximum: 9007199254740991
        difference_vnd:
          type: [integer, 'null']
          minimum: -9007199254740991
          maximum: 9007199254740991
        local_expected_fee_amount_vnd:
          type: [integer, 'null']
          minimum: 0
          maximum: 9007199254740991
        fee_difference_vnd:
          type: [integer, 'null']
          minimum: -9007199254740991
          maximum: 9007199254740991
    FinancialReconciliationBatchSummary:
      type: object
      additionalProperties: false
      required:
        [
          id,
          source,
          status,
          batch_reference_masked,
          business_date,
          currency,
          record_count,
          matched_count,
          exception_count,
          gross_amount_vnd,
          fee_amount_vnd,
          net_amount_vnd,
          local_expected_amount_vnd,
          difference_vnd,
          local_expected_fee_amount_vnd,
          fee_difference_vnd,
          version,
          created_at,
        ]
      properties:
        id: { type: string, format: uuid }
        source: { type: string, enum: [PAYMENT_PROVIDER, SHIPPING_PROVIDER] }
        status: { $ref: '#/components/schemas/FinancialReconciliationBatchStatus' }
        batch_reference_masked: { type: string, minLength: 1, maxLength: 160 }
        business_date: { type: string, format: date }
        currency: { type: string, const: VND }
        record_count: { type: integer, minimum: 1, maximum: 500 }
        matched_count: { type: integer, minimum: 0, maximum: 500 }
        exception_count: { type: integer, minimum: 0, maximum: 500 }
        gross_amount_vnd: { type: integer, minimum: 1, maximum: 9007199254740991 }
        fee_amount_vnd: { type: integer, minimum: 0, maximum: 9007199254740991 }
        net_amount_vnd: { type: integer, minimum: -9007199254740991, maximum: 9007199254740991 }
        local_expected_amount_vnd: { type: integer, minimum: 0, maximum: 9007199254740991 }
        difference_vnd: { type: integer, minimum: -9007199254740991, maximum: 9007199254740991 }
        local_expected_fee_amount_vnd: { type: integer, minimum: 0, maximum: 9007199254740991 }
        fee_difference_vnd: { type: integer, minimum: -9007199254740991, maximum: 9007199254740991 }
        version: { type: integer, const: 1 }
        created_at: { type: string, format: date-time }
    FinancialReconciliationBatchDetail:
      allOf:
        - $ref: '#/components/schemas/FinancialReconciliationBatchSummary'
        - type: object
          required: [lines]
          properties:
            lines:
              type: array
              minItems: 1
              maxItems: 500
              items: { $ref: '#/components/schemas/FinancialReconciliationLine' }
    FinancialReconciliationImportResult:
      allOf:
        - $ref: '#/components/schemas/FinancialReconciliationBatchDetail'
        - type: object
          required: [replayed]
          properties:
            replayed: { type: boolean }
    FinancialReconciliationBatchPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FinancialReconciliationBatchSummary' }
