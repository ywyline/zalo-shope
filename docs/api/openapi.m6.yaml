    PrivacyAccountClosureCreateRequest:
      type: object
      additionalProperties: false
      required: [confirmation_code, description, request_type]
      properties:
        confirmation_code: { type: string, const: SUBMIT_ACCOUNT_CLOSURE_REQUEST }
        description: { type: string, minLength: 10, maxLength: 1000 }
        request_type: { type: string, const: ACCOUNT_CLOSURE }
    PrivacyRequestCancelRequest:
      type: object
      additionalProperties: false
      required: [confirmation_code, expected_version, reason]
      properties:
        confirmation_code: { type: string, const: CANCEL_PRIVACY_REQUEST }
        expected_version: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 10, maxLength: 500 }
    PrivacyRequest:
      type: object
      additionalProperties: false
      required: [public_number, request_type, status, description, version, created_at, updated_at]
      properties:
        public_number: { type: string, pattern: '^PRV-[A-Z0-9]{16,32}$' }
        request_type: { $ref: '#/components/schemas/PrivacyRequestType' }
        status: { $ref: '#/components/schemas/PrivacyRequestStatus' }
        description: { type: string, minLength: 10, maxLength: 1000 }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PrivacyRequestPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PrivacyRequest' } }
        next_cursor:
          oneOf:
            - { $ref: '#/components/schemas/OpaqueCursor' }
            - { type: 'null' }
    ShareTargetType:
      type: string
      enum: [STORE, BRAND, CATEGORY, PRODUCT, PROMOTION, COUPON]
    ShareSource:
      type: string
      enum:
        [
          STORE_HOME,
          BRAND_PAGE,
          CATEGORY_PAGE,
          PRODUCT_DETAIL,
          PROMOTION_PAGE,
          COUPON_PAGE,
          MEMBER_CENTER,
        ]
    StoreShareCreateRequest:
      type: object
      additionalProperties: false
      required: [locale, source, target_type]
      properties:
        attribution_token:
          { type: string, minLength: 20, maxLength: 512, pattern: '^[A-Za-z0-9_-]+$' }
        locale: { type: string, enum: [vi, zh, en], default: vi }
        source: { $ref: '#/components/schemas/ShareSource' }
        target_type: { type: string, const: STORE }
    CodedShareCreateRequest:
      type: object
      additionalProperties: false
      required: [locale, source, target_code, target_type]
      properties:
        attribution_token:
          { type: string, minLength: 20, maxLength: 512, pattern: '^[A-Za-z0-9_-]+$' }
        locale: { type: string, enum: [vi, zh, en], default: vi }
        source: { $ref: '#/components/schemas/ShareSource' }
        target_code: { $ref: '#/components/schemas/PublicCode' }
        target_type: { type: string, enum: [BRAND, CATEGORY, PRODUCT, PROMOTION, COUPON] }
    ShareCreateRequest:
      oneOf:
        - { $ref: '#/components/schemas/StoreShareCreateRequest' }
        - { $ref: '#/components/schemas/CodedShareCreateRequest' }
      discriminator: { propertyName: target_type }
    ShareCard:
      type: object
      additionalProperties: false
      required:
        [
          short_code,
          target_type,
          requested_locale,
          resolved_locale,
          title,
          summary,
          image_url,
          mini_app_path,
          browser_url,
        ]
      properties:
        short_code: { $ref: '#/components/schemas/ShortCode' }
        target_type: { $ref: '#/components/schemas/ShareTargetType' }
        target_code:
          oneOf:
            - { $ref: '#/components/schemas/PublicCode' }
            - { type: 'null' }
        requested_locale: { type: string, enum: [vi, zh, en] }
        resolved_locale: { type: string, enum: [vi, zh, en] }
        title: { type: string, maxLength: 240 }
        summary: { type: string, maxLength: 500 }
        image_url: { $ref: '#/components/schemas/HttpsUrl' }
        mini_app_path: { $ref: '#/components/schemas/MiniAppPath' }
        browser_url: { $ref: '#/components/schemas/HttpsUrl' }
    ShareCreation:
      type: object
      additionalProperties: false
      required: [card, interaction_token]
      properties:
        card: { $ref: '#/components/schemas/ShareCard' }
        interaction_token:
          { type: string, minLength: 20, maxLength: 512, pattern: '^[A-Za-z0-9_-]+$' }
    ShareOutcomeRequest:
      type: object
      additionalProperties: false
      required: [interaction_token, outcome]
      properties:
        interaction_token:
          { type: string, minLength: 20, maxLength: 512, pattern: '^[A-Za-z0-9_-]+$' }
        outcome: { type: string, enum: [COMPLETED, CANCELLED] }
    AfterSalePublicConflictCode:
      type: string
      enum:
        [
          AFTER_SALE_STATE_CONFLICT,
          AFTER_SALE_VERSION_CONFLICT,
          AFTER_SALE_IDEMPOTENCY_CONFLICT,
          AFTER_SALE_QUANTITY_EXCEEDS_AVAILABLE,
          AFTER_SALE_POLICY_MISMATCH,
          AFTER_SALE_RETURN_WINDOW_CLOSED,
          AFTER_SALE_REFUND_EXCEEDS_APPROVED,
        ]
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message_key, correlation_id]
      properties:
        code:
          type: string
          enum:
            [
              AUTHENTICATION_REQUIRED,
              AUTHENTICATION_FAILED,
              AUTHORIZATION_DENIED,
              INPUT_INVALID,
              RESOURCE_NOT_FOUND,
              STORE_CONTEXT_INVALID,
              CONFLICT,
              RATE_LIMITED,
              UPSTREAM_UNAVAILABLE,
              INTERNAL_ERROR,
            ]
        message_key: { type: string }
        correlation_id:
          type: string
          minLength: 8
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
        details:
          type: object
          additionalProperties: true
          properties:
            after_sale_code: { $ref: '#/components/schemas/AfterSalePublicConflictCode' }
  headers:
    CorrelationId:
      required: true
      description: Same safe identifier propagated through transaction, audit, logs and error body
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
    FallbackCsp:
      required: true
      schema:
        type: string
        pattern: "^default-src 'none';"
    NoSniff:
      required: true
      schema: { type: string, const: nosniff }
    NoReferrer:
      required: true
      schema: { type: string, const: no-referrer }
    PublicFallbackCache:
      required: true
      schema: { type: string, const: 'public, max-age=300' }
    PrivateNoStore:
      required: true
      schema: { type: string, const: 'private, no-store' }
  responses:
    BadRequest:
      description: Strict DTO, cursor, filter, file metadata, header or path input is invalid
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthorized:
      description: Authentication failed
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: The actor lacks the target-store permission or required fresh MFA
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: The resource is absent in the current actor and store scope
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: >-
        State, version, quantity, amount, policy, inventory or idempotency conflict. After-sale
        responses expose only details.after_sale_code values from AfterSalePublicConflictCode.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    RateLimited:
      description: >-
        Request rate exceeded for the frozen store+actor tier. The response does not disclose
        account existence or cross-store activity.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
        Retry-After:
          required: true
          schema: { type: integer, minimum: 1, maximum: 60 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    AfterSaleReadLimiterUnavailable:
      description: >-
        The required Redis-backed after-sale read limiter is unavailable. The read fails closed
        before querying the target after-sale resource and ApiError.code is UPSTREAM_UNAVAILABLE. No
        Retry-After header is promised because recovery depends on infrastructure health rather than
        a known rate-limit window.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    ServiceUnavailable:
      description: >-
        Required magic-byte/type/size/count evidence validation, scanning, claim, protected retrieval
        or deletion compensation capability is unavailable; the request fails closed and no case is
        created.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
        Retry-After:
          required: true
          schema: { type: integer, minimum: 1, maximum: 3600 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
