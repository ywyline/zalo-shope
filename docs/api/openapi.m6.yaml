        available: { type: boolean }
        primary_media_url:
          oneOf:
            - { $ref: '#/components/schemas/HttpsUrl' }
            - { type: 'null' }
        last_interaction_at: { type: string, format: date-time }
    MemberProductPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/MemberProduct' } }
        next_cursor:
          oneOf:
            - { $ref: '#/components/schemas/OpaqueCursor' }
            - { type: 'null' }
    MemberCommerceSummary:
      type: object
      additionalProperties: false
      required:
        [
          address_count,
          usable_coupon_count,
          favorite_count,
          product_history_count,
          order_status_counts,
        ]
      properties:
        address_count: { type: integer, minimum: 0 }
        usable_coupon_count: { type: integer, minimum: 0 }
        favorite_count: { type: integer, minimum: 0 }
        product_history_count: { type: integer, minimum: 0, maximum: 100 }
        order_status_counts:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
    PrivacyRequestType:
      type: string
      enum: [ACCESS, CORRECTION, DELETION, ANONYMIZATION, ACCOUNT_CLOSURE]
    PrivacyRequestStatus:
      type: string
      enum: [SUBMITTED, UNDER_REVIEW, ACTION_REQUIRED, IN_PROGRESS, COMPLETED, REJECTED, CANCELLED]
    PrivacyRequestCreateRequest:
      oneOf:
        - $ref: '#/components/schemas/PrivacyAccessCreateRequest'
        - $ref: '#/components/schemas/PrivacyCorrectionCreateRequest'
        - $ref: '#/components/schemas/PrivacyDeletionCreateRequest'
        - $ref: '#/components/schemas/PrivacyAnonymizationCreateRequest'
        - $ref: '#/components/schemas/PrivacyAccountClosureCreateRequest'
      discriminator: { propertyName: request_type }
    PrivacyAccessCreateRequest:
      type: object
      additionalProperties: false
      required: [confirmation_code, description, request_type]
      properties:
        confirmation_code: { type: string, const: SUBMIT_DATA_ACCESS_REQUEST }
        description: { type: string, minLength: 10, maxLength: 1000 }
        request_type: { type: string, const: ACCESS }
    PrivacyCorrectionCreateRequest:
      type: object
      additionalProperties: false
      required: [confirmation_code, description, request_type]
      properties:
        confirmation_code: { type: string, const: SUBMIT_DATA_CORRECTION_REQUEST }
        description: { type: string, minLength: 10, maxLength: 1000 }
        request_type: { type: string, const: CORRECTION }
    PrivacyDeletionCreateRequest:
      type: object
      additionalProperties: false
      required: [confirmation_code, description, request_type]
      properties:
        confirmation_code: { type: string, const: SUBMIT_DATA_DELETION_REQUEST }
        description: { type: string, minLength: 10, maxLength: 1000 }
        request_type: { type: string, const: DELETION }
    PrivacyAnonymizationCreateRequest:
      type: object
      additionalProperties: false
      required: [confirmation_code, description, request_type]
      properties:
        confirmation_code: { type: string, const: SUBMIT_DATA_ANONYMIZATION_REQUEST }
        description: { type: string, minLength: 10, maxLength: 1000 }
        request_type: { type: string, const: ANONYMIZATION }
    PrivacyAccountClosureCreateRequest:
      type: object
      additionalProperties: false
      required: [confirmation_code, description, request_type]
      properties:
        confirmation_code: { type: string, const: SUBMIT_ACCOUNT_CLOSURE_REQUEST }
        description: { type: string, minLength: 10, maxLength: 1000 }
        request_type: { type: string, const: ACCOUNT_CLOSURE }
    PrivacyRequestCancelRequest:
      type: object
      additionalProperties: false
      required: [confirmation_code, expected_version, reason]
      properties:
        confirmation_code: { type: string, const: CANCEL_PRIVACY_REQUEST }
        expected_version: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 10, maxLength: 500 }
    PrivacyRequest:
      type: object
      additionalProperties: false
      required: [public_number, request_type, status, description, version, created_at, updated_at]
      properties:
        public_number: { type: string, pattern: '^PRV-[A-Z0-9]{16,32}$' }
        request_type: { $ref: '#/components/schemas/PrivacyRequestType' }
        status: { $ref: '#/components/schemas/PrivacyRequestStatus' }
        description: { type: string, minLength: 10, maxLength: 1000 }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PrivacyRequestPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PrivacyRequest' } }
        next_cursor:
          oneOf:
            - { $ref: '#/components/schemas/OpaqueCursor' }
            - { type: 'null' }
    ShareTargetType:
      type: string
      enum: [STORE, BRAND, CATEGORY, PRODUCT, PROMOTION, COUPON]
    ShareSource:
      type: string
      enum:
        [
          STORE_HOME,
          BRAND_PAGE,
          CATEGORY_PAGE,
          PRODUCT_DETAIL,
          PROMOTION_PAGE,
          COUPON_PAGE,
          MEMBER_CENTER,
        ]
    StoreShareCreateRequest:
      type: object
      additionalProperties: false
      required: [locale, source, target_type]
      properties:
        attribution_token:
          { type: string, minLength: 20, maxLength: 512, pattern: '^[A-Za-z0-9_-]+$' }
        locale: { type: string, enum: [vi, zh, en], default: vi }
        source: { $ref: '#/components/schemas/ShareSource' }
        target_type: { type: string, const: STORE }
    CodedShareCreateRequest:
      type: object
      additionalProperties: false
      required: [locale, source, target_code, target_type]
      properties:
        attribution_token:
          { type: string, minLength: 20, maxLength: 512, pattern: '^[A-Za-z0-9_-]+$' }
        locale: { type: string, enum: [vi, zh, en], default: vi }
        source: { $ref: '#/components/schemas/ShareSource' }
        target_code: { $ref: '#/components/schemas/PublicCode' }
        target_type: { type: string, enum: [BRAND, CATEGORY, PRODUCT, PROMOTION, COUPON] }
    ShareCreateRequest:
      oneOf:
        - { $ref: '#/components/schemas/StoreShareCreateRequest' }
        - { $ref: '#/components/schemas/CodedShareCreateRequest' }
      discriminator: { propertyName: target_type }
    ShareCard:
      type: object
      additionalProperties: false
      required:
        [
          short_code,
          target_type,
          requested_locale,
          resolved_locale,
          title,
          summary,
          image_url,
          mini_app_path,
          browser_url,
        ]
      properties:
        short_code: { $ref: '#/components/schemas/ShortCode' }
        target_type: { $ref: '#/components/schemas/ShareTargetType' }
        target_code:
          oneOf:
            - { $ref: '#/components/schemas/PublicCode' }
            - { type: 'null' }
        requested_locale: { type: string, enum: [vi, zh, en] }
        resolved_locale: { type: string, enum: [vi, zh, en] }
        title: { type: string, maxLength: 240 }
        summary: { type: string, maxLength: 500 }
        image_url: { $ref: '#/components/schemas/HttpsUrl' }
        mini_app_path: { $ref: '#/components/schemas/MiniAppPath' }
        browser_url: { $ref: '#/components/schemas/HttpsUrl' }
    ShareCreation:
      type: object
      additionalProperties: false
      required: [card, interaction_token]
      properties:
        card: { $ref: '#/components/schemas/ShareCard' }
        interaction_token:
          { type: string, minLength: 20, maxLength: 512, pattern: '^[A-Za-z0-9_-]+$' }
    ShareOutcomeRequest:
      type: object
      additionalProperties: false
      required: [interaction_token, outcome]
      properties:
        interaction_token:
          { type: string, minLength: 20, maxLength: 512, pattern: '^[A-Za-z0-9_-]+$' }
        outcome: { type: string, enum: [COMPLETED, CANCELLED] }
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message_key, correlation_id]
      properties:
        code:
          type: string
          enum:
            [
              AUTHENTICATION_REQUIRED,
              AUTHENTICATION_FAILED,
              AUTHORIZATION_DENIED,
              INPUT_INVALID,
              RESOURCE_NOT_FOUND,
              STORE_CONTEXT_INVALID,
              CONFLICT,
              RATE_LIMITED,
              UPSTREAM_UNAVAILABLE,
              INTERNAL_ERROR,
            ]
        message_key: { type: string }
        correlation_id: { type: string }
        details: { type: object, additionalProperties: true }
  headers:
    FallbackCsp:
      required: true
      schema:
        type: string
        pattern: "^default-src 'none';"
    NoSniff:
      required: true
      schema: { type: string, const: nosniff }
    NoReferrer:
      required: true
      schema: { type: string, const: no-referrer }
    PublicFallbackCache:
      required: true
      schema: { type: string, const: 'public, max-age=300' }
    PrivateNoStore:
      required: true
      schema: { type: string, const: 'private, no-store' }
  responses:
    BadRequest:
      description: Strict DTO, file metadata, header or path input is invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: The actor lacks the target-store permission or required fresh MFA
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: The resource is absent in the current actor and store scope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: State, version, quantity, amount, policy, inventory or idempotency conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    RateLimited:
      description: Request rate exceeded
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
