        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/shares:
    post:
      operationId: createShareLink
      summary: Create an opaque, store-bound share link from a published target
      description: The client cannot provide a URL, title, image, member ID or store ID.
      security: [{ MemberBearer: [] }, {}]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShareCreateRequest' }
      responses:
        '201':
          description: Server-resolved card and links
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareCreation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/shares/{shortCode}:
    get:
      operationId: resolveShareLink
      summary: Resolve an opaque share link to a safe Mini App and browser target
      security: []
      parameters:
        - { $ref: '#/components/parameters/ShortCode' }
        - { $ref: '#/components/parameters/Locale' }
      responses:
        '200':
          description: Published target or safe store-home fallback
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareCard' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/shares/{shortCode}/outcome:
    post:
      operationId: recordShareOutcome
      summary: Record a user-driven share-sheet completion or cancellation
      description: >-
        The signed interaction token is issued only by share creation and is bound to the short
        code, initial interaction and expiry. Outcomes are idempotent analytics facts and never
        authorize rewards, commission, redirects or financial changes.
      security: []
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/ShortCode' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShareOutcomeRequest' }
      responses:
        '204': { description: Outcome recorded or idempotently replayed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /s/{shortCode}:
    get:
      operationId: renderShareFallback
      summary: Render escaped OG metadata and an explicit open-in-Zalo action
      security: []
      parameters:
        - { $ref: '#/components/parameters/ShortCode' }
      responses:
        '200':
          description: >-
            CSP-protected browser fallback with an explicit open action; no Location header,
            meta refresh or request-controlled redirect is permitted
          headers:
            Content-Security-Policy: { $ref: '#/components/headers/FallbackCsp' }
            X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
            Referrer-Policy: { $ref: '#/components/headers/NoReferrer' }
            Cache-Control: { $ref: '#/components/headers/PublicFallbackCache' }
          content:
            text/html:
              schema: { type: string }
        '404':
          description: Unknown code renders a static safe chooser without Location or meta refresh
          headers:
            Content-Security-Policy: { $ref: '#/components/headers/FallbackCsp' }
            X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
            Referrer-Policy: { $ref: '#/components/headers/NoReferrer' }
            Cache-Control: { $ref: '#/components/headers/PublicFallbackCache' }
components:
  securitySchemes:
    MemberBearer:
      type: http
      scheme: bearer
      bearerFormat: ZaloShopMemberToken
    AdminBearer:
      type: http
      scheme: bearer
      bearerFormat: ZaloShopAdminToken
  parameters:
    StoreCode:
      name: X-Store-Code
      in: header
      required: true
      schema: { type: string, minLength: 2, maxLength: 64, pattern: '^[a-z][a-z0-9-]*$' }
    StoreIdQuery:
      name: store_id
      in: query
      required: true
      schema: { type: string, format: uuid }
    AccessReason:
      name: X-Access-Reason
      in: header
      required: false
      description: >-
        Optional for a store-assigned administrator; required and audited when a platform
        administrator uses platform.stores.cross_access to enter the target store scope.
      schema: { type: string, minLength: 10, maxLength: 500 }
    CorrelationIdRequest:
      name: X-Correlation-Id
      in: header
      required: false
      description: >-
        Optional safe client correlation identifier. The response X-Correlation-Id is authoritative;
        unsafe supplied values are not propagated and are replaced with a server-generated value.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[!-~]+$' }
    AfterSaleId:
      name: afterSaleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EvidenceId:
      name: evidenceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SettlementNumber:
      name: settlementNumber
      in: path
      required: true
      schema: { type: string, pattern: '^AST-[A-Z0-9]{16,32}$' }
    ProductCode:
      name: productCode
      in: path
      required: true
      schema: { $ref: '#/components/schemas/PublicCode' }
    PolicyCode:
      name: policyCode
      in: path
      required: true
      schema: { $ref: '#/components/schemas/PublicCode' }
    PolicyVersionNumber:
      name: versionNumber
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ShortCode:
      name: shortCode
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ShortCode' }
    PrivacyRequestNumber:
      name: requestNumber
      in: path
      required: true
      schema: { type: string, pattern: '^PRV-[A-Z0-9]{16,32}$' }
    Cursor:
      name: cursor
      in: query
      description: >-
        c1_ token signed with a dedicated rotatable HMAC key and bound to schema version, store,
        authenticated subject type/id, resource, canonical filters, sort key/id and expiry. Any
        tampering, scope reuse or expiry returns the same stable 400 response.
      schema: { $ref: '#/components/schemas/OpaqueCursor' }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Locale:
      name: locale
      in: query
      schema: { type: string, enum: [vi, zh, en], default: vi }
    AdminLocale:
      name: locale
      in: query
      description: Omit to resolve the store default locale, then fall back to Vietnamese.
      schema: { type: string, enum: [vi, zh, en] }
  schemas:
    OpaqueCursor:
      type: string
      minLength: 23
      maxLength: 512
      pattern: '^c1_[A-Za-z0-9_-]{20,509}$'
      description: Syntax only; accepting the token also requires the scoped HMAC verification above.
    ShortCode:
      type: string
      minLength: 20
      maxLength: 128
      pattern: '^[A-Za-z0-9_-]+$'
    HttpsUrl:
      type: string
      format: uri
      pattern: '^https://'
    MiniAppPath:
      type: string
      pattern: '^/(?:\?locale=(?:vi|zh|en)|(?:brands|categories|products|promotions|coupons)/[a-z0-9]+(?:-[a-z0-9]+)*\?locale=(?:vi|zh|en))$'
    PublicCode:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
    AfterSaleType:
      type: string
      enum: [REFUND_ONLY, RETURN_REFUND, EXCHANGE, MERCHANT_REFUND]
    AfterSaleStatus:
      type: string
      enum:
        [
          PENDING_REVIEW,
          APPROVED,
          REJECTED,
          CANCELLED,
          RETURN_PENDING,
          RETURN_IN_TRANSIT,
          INSPECTION_PENDING,
          REFUND_PENDING,
          REFUND_PROCESSING,
          REFUNDED,
          EXCHANGE_PENDING,
          EXCHANGE_IN_TRANSIT,
          REVIEW_REQUIRED,
          COMPLETED,
        ]
    EvidenceUploadRequest:
      type: object
      additionalProperties: false
      required: [byte_size, checksum_sha256, filename, mime_type]
      properties:
        byte_size: { type: integer, minimum: 1, maximum: 52428800 }
        checksum_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        filename: { type: string, minLength: 1, maxLength: 255, pattern: '^[^/\\]+$' }
        mime_type: { type: string, enum: [image/jpeg, image/png, image/webp, video/mp4] }
      allOf:
        - if:
            properties:
              mime_type: { enum: [image/jpeg, image/png, image/webp] }
          then:
            properties:
              byte_size: { maximum: 10485760 }
    EvidenceUpload:
      type: object
      additionalProperties: false
      required: [evidence_id, upload_url, expires_at, version]
      properties:
        evidence_id: { type: string, format: uuid }
        upload_url: { $ref: '#/components/schemas/HttpsUrl' }
        expires_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    EvidenceConfirmRequest:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version: { type: integer, minimum: 1 }
    EvidenceView:
      type: object
      additionalProperties: false
      description: >-
        Safe public projection. Internal scan, quarantine and deletion states are collapsed into
        UNAVAILABLE so member and ordinary admin responses cannot reveal cleanup or security detail.
      required: [evidence_id, status, access_expires_at, version]
      properties:
        evidence_id: { type: string, format: uuid }
        status:
          type: string
          enum: [PENDING, READY, UNAVAILABLE]
        access_expires_at:
          type: [string, 'null']
          format: date-time
          description: >-
            Exclusive ordinary-access deadline; null when unavailable. A legal hold never extends it.
        version: { type: integer, minimum: 1 }
      oneOf:
        - properties:
            status: { const: READY }
            access_expires_at: { type: string, format: date-time }
        - properties:
            status: { enum: [PENDING, UNAVAILABLE] }
            access_expires_at: { type: 'null' }
    EvidenceAccess:
      type: object
      additionalProperties: false
      required: [url, expires_at]
      properties:
        url: { $ref: '#/components/schemas/HttpsUrl' }
        expires_at: { type: string, format: date-time }
    AfterSaleStandardItemInput:
      type: object
      additionalProperties: false
      required: [order_item_id, quantity]
      properties:
        order_item_id: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 1000 }
    AfterSaleExchangeItemInput:
      type: object
      additionalProperties: false
      required: [order_item_id, quantity, replacement_sku_id]
      properties:
        order_item_id: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 1000 }
        replacement_sku_id: { type: string, format: uuid }
    RefundOnlyCreateRequest:
      type: object
      additionalProperties: false
      required: [description, evidence_ids, items, order_id, reason_code, type]
      properties:
        description: { type: string, minLength: 10, maxLength: 2000 }
        evidence_ids:
          { type: array, maxItems: 6, uniqueItems: true, items: { type: string, format: uuid } }
        items:
          {
            type: array,
            minItems: 1,
            maxItems: 20,
            items: { $ref: '#/components/schemas/AfterSaleStandardItemInput' },
          }
        order_id: { type: string, format: uuid }
        reason_code: { $ref: '#/components/schemas/PublicCode' }
        type: { type: string, const: REFUND_ONLY }
    ReturnRefundCreateRequest:
      type: object
      additionalProperties: false
      required: [description, evidence_ids, items, order_id, reason_code, type]
      properties:
        description: { type: string, minLength: 10, maxLength: 2000 }
        evidence_ids:
          { type: array, maxItems: 6, uniqueItems: true, items: { type: string, format: uuid } }
        items:
          {
            type: array,
            minItems: 1,
            maxItems: 20,
            items: { $ref: '#/components/schemas/AfterSaleStandardItemInput' },
          }
        order_id: { type: string, format: uuid }
        reason_code: { $ref: '#/components/schemas/PublicCode' }
        type: { type: string, const: RETURN_REFUND }
    ExchangeCreateRequest:
      type: object
      additionalProperties: false
      required: [description, evidence_ids, items, order_id, reason_code, type]
      properties:
        description: { type: string, minLength: 10, maxLength: 2000 }
        evidence_ids:
          { type: array, maxItems: 6, uniqueItems: true, items: { type: string, format: uuid } }
        items:
          {
            type: array,
            minItems: 1,
            maxItems: 20,
            items: { $ref: '#/components/schemas/AfterSaleExchangeItemInput' },
          }
        order_id: { type: string, format: uuid }
        reason_code: { $ref: '#/components/schemas/PublicCode' }
        type: { type: string, const: EXCHANGE }
    AfterSaleCreateRequest:
      oneOf:
        - { $ref: '#/components/schemas/RefundOnlyCreateRequest' }
        - { $ref: '#/components/schemas/ReturnRefundCreateRequest' }
        - { $ref: '#/components/schemas/ExchangeCreateRequest' }
      discriminator: { propertyName: type }
    MerchantAfterSaleCreateRequest:
      type: object
      additionalProperties: false
      required: [description, items, reason_code, type]
      properties:
        description: { type: string, minLength: 10, maxLength: 2000 }
        items:
          {
            type: array,
            minItems: 1,
            maxItems: 20,
            items: { $ref: '#/components/schemas/AfterSaleStandardItemInput' },
          }
        reason_code: { $ref: '#/components/schemas/PublicCode' }
        type: { type: string, const: MERCHANT_REFUND }
    VersionedReasonRequest:
      type: object
      additionalProperties: false
      required: [expected_version, reason]
      properties:
        expected_version: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 10, maxLength: 500 }
    ReturnShipmentRequest:
      type: object
      additionalProperties: false
      required: [carrier_name, expected_version, tracking_number]
      properties:
        carrier_name: { type: string, minLength: 2, maxLength: 160 }
        expected_version: { type: integer, minimum: 1 }
        tracking_number: { type: string, minLength: 2, maxLength: 160 }
    AfterSaleApprovedItemInput:
      type: object
      additionalProperties: false
      required: [approved_quantity, order_item_id]
      properties:
        approved_quantity: { type: integer, minimum: 0, maximum: 1000 }
        order_item_id: { type: string, format: uuid }
    ApproveAfterSaleReviewRequest:
      type: object
      additionalProperties: false
      description: >-
        order_item_id values are unique and must exactly cover every requested case line. Each
        approved_quantity is bounded by that line's requested quantity and at least one is positive.
      required: [confirmation_code, decision, expected_version, items, reason]
      properties:
        confirmation_code: { type: string, const: APPROVE_AFTER_SALE }
        decision: { type: string, const: APPROVE }
        expected_version: { type: integer, minimum: 1 }
        items:
          {
            type: array,
            minItems: 1,
            maxItems: 20,
            items: { $ref: '#/components/schemas/AfterSaleApprovedItemInput' },
          }
        reason: { type: string, minLength: 10, maxLength: 500 }
    RejectAfterSaleReviewRequest:
      type: object
      additionalProperties: false
      required: [confirmation_code, decision, expected_version, reason]
      properties:
        confirmation_code: { type: string, const: REJECT_AFTER_SALE }
        decision: { type: string, const: REJECT }
        expected_version: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 10, maxLength: 500 }
    AfterSaleReviewRequest:
      oneOf:
        - { $ref: '#/components/schemas/ApproveAfterSaleReviewRequest' }
        - { $ref: '#/components/schemas/RejectAfterSaleReviewRequest' }
      discriminator: { propertyName: decision }
    AfterSaleRefundRequest:
      type: object
      additionalProperties: false
      required: [confirmation_code, expected_version, reason]
      properties:
        confirmation_code: { type: string, const: ISSUE_AFTER_SALE_REFUND }
        expected_version: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 10, maxLength: 500 }
    AfterSaleExchangeRequest:
      type: object
      additionalProperties: false
      required: [confirmation_code, expected_version, reason]
      properties:
        confirmation_code: { type: string, const: CREATE_EXCHANGE }
        expected_version: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 10, maxLength: 500 }
    AfterSaleExchangeToRefundRequest:
      type: object
      additionalProperties: false
      required: [confirmation_code, expected_version, reason]
      properties:
        confirmation_code: { type: string, const: CONVERT_EXCHANGE_TO_REFUND }
        expected_version: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 10, maxLength: 500 }
    AfterSaleReviewResolutionBase:
      type: object
      additionalProperties: false
      required: [confirmation_code, decision, expected_version, reason]
      properties:
        confirmation_code: { type: string, const: RESOLVE_AFTER_SALE_REVIEW }
        decision: { type: string, enum: [RESUME, REJECT] }
        expected_version: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 10, maxLength: 500 }
    LegacyAfterSaleApproveRequest:
      type: object
      additionalProperties: false
      required:
        [
          confirmation_code,
          decision,
          expected_version,
          policy_basis,
          reason,
          return_shipping_payer,
          return_window_days,
        ]
      properties:
        confirmation_code: { type: string, const: RESOLVE_AFTER_SALE_REVIEW }
        decision: { type: string, const: LEGACY_APPROVE }
        expected_version: { type: integer, minimum: 1 }
        policy_basis: { type: string, minLength: 10, maxLength: 2000 }
        reason: { type: string, minLength: 10, maxLength: 500 }
        return_shipping_payer:
          { type: [string, 'null'], enum: [BUYER, MERCHANT, CONDITIONAL, null] }
        return_window_days: { type: [integer, 'null'], minimum: 1, maximum: 60 }
      allOf:
        - oneOf:
            - properties:
                return_shipping_payer: { type: string, enum: [BUYER, MERCHANT, CONDITIONAL] }
                return_window_days: { type: integer, minimum: 1, maximum: 60 }
            - properties:
                return_shipping_payer: { type: 'null' }
                return_window_days: { type: 'null' }
    LegacyAfterSaleRejectRequest:
      type: object
      additionalProperties: false
      required: [confirmation_code, decision, expected_version, policy_basis, reason]
      properties:
        confirmation_code: { type: string, const: RESOLVE_AFTER_SALE_REVIEW }
        decision: { type: string, const: LEGACY_REJECT }
        expected_version: { type: integer, minimum: 1 }
        policy_basis: { type: string, minLength: 10, maxLength: 2000 }
        reason: { type: string, minLength: 10, maxLength: 500 }
    AfterSaleReviewResolveRequest:
      oneOf:
        - { $ref: '#/components/schemas/AfterSaleReviewResolutionBase' }
        - { $ref: '#/components/schemas/LegacyAfterSaleApproveRequest' }
        - { $ref: '#/components/schemas/LegacyAfterSaleRejectRequest' }
      discriminator: { propertyName: decision }
    AfterSaleCodRefundConfirmRequest:
      type: object
      additionalProperties: false
      required: [confirmation_code, expected_settlement_version, expected_version, reason]
      properties:
        confirmation_code: { type: string, const: CONFIRM_COD_REFUND }
        expected_settlement_version: { type: integer, minimum: 1 }
        expected_version: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 10, maxLength: 500 }
    AfterSaleItem:
      type: object
      additionalProperties: false
      required:
        [
          order_item_id,
          requested_quantity,
          approved_quantity,
          received_quantity,
          accepted_quantity,
          rejected_quantity,
          restockable_quantity,
          restored_quantity,
        ]
      properties:
        order_item_id: { type: string, format: uuid }
        requested_quantity: { type: integer, minimum: 1 }
        approved_quantity: { type: integer, minimum: 0 }
        received_quantity: { type: integer, minimum: 0 }
        accepted_quantity: { type: integer, minimum: 0 }
        rejected_quantity: { type: integer, minimum: 0 }
        restockable_quantity: { type: integer, minimum: 0 }
        restored_quantity: { type: integer, minimum: 0 }
        replacement_sku_id: { type: [string, 'null'], format: uuid }
    AfterSaleTimelineEntry:
      type: object
      additionalProperties: false
      required: [event, status, created_at]
      properties:
        event:
          type: string
          enum:
            [
              APPROVE,
              REJECT,
              CANCEL,
              START_RETURN,
              RETURN_EXPIRED,
              RETURN_SHIPPED,
              RETURN_RECEIVED,
              ACCEPT_INSPECTION,
              REJECT_INSPECTION,
              QUEUE_REFUND,
              REFUND_REQUESTED,
              REFUND_SUCCEEDED,
              REFUND_FAILED,
              REFUND_CANCELLED,
              CONVERT_EXCHANGE_TO_REFUND,
              EXCHANGE_SHIPPED,
              EXCHANGE_DELIVERED,
              REQUIRE_REVIEW,
              RESUME_REVIEW,
              REJECT_REVIEW,
              LEGACY_APPROVE,
              LEGACY_REJECT,
              COMPLETE,
            ]
        status: { $ref: '#/components/schemas/AfterSaleStatus' }
        created_at: { type: string, format: date-time }
    AfterSaleSettlementView:
      type: object
      additionalProperties: false
      required: [public_number, method, status, amount_vnd, created_at, updated_at]
      properties:
        public_number:
          type: string
          pattern: '^AST-[A-Z0-9]{16,32}$'
          description: Stable, server-generated and unguessable settlement command identifier
        method: { type: string, enum: [ONLINE_ORIGINAL, COD_OFFLINE, NO_PAYOUT] }
        status:
          type: string
          enum: [PENDING, PROCESSING, SUCCEEDED, FAILED, REVIEW_REQUIRED, CANCELLED]
        amount_vnd: { type: integer, minimum: 0, maximum: 9007199254740991 }
        refund_public_number: { type: [string, 'null'], maxLength: 64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AfterSaleReturnShipmentView:
      type: object
      additionalProperties: false
      required: [carrier_name, masked_tracking_number, status, submitted_at]
      properties:
        carrier_name: { type: string, minLength: 2, maxLength: 160 }
        masked_tracking_number: { type: string, minLength: 2, maxLength: 160 }
        status:
          type: string
          enum: [SUBMITTED, IN_TRANSIT, DELIVERED, REJECTED, UNKNOWN]
        submitted_at: { type: string, format: date-time }
    AfterSalePolicySnapshotView:
      type: object
      additionalProperties: false
      required:
        [
          legacy_policy_review,
          policy_code,
          policy_version_number,
          resolved_locale,
          name,
          summary,
          buyer_instructions,
        ]
      properties:
        legacy_policy_review: { type: boolean }
        policy_code:
          oneOf:
            - { $ref: '#/components/schemas/PublicCode' }
            - { type: 'null' }
        policy_version_number: { type: [integer, 'null'], minimum: 1 }
        resolved_locale:
          type: [string, 'null']
          enum: [vi, zh, en, null]
          description: >-
            Member reads use preferredLocale then vi; admin reads use explicit locale, then store
            default, then vi. Null is reserved for a legacy case without a policy snapshot.
        name: { type: [string, 'null'], maxLength: 160 }
        summary: { type: [string, 'null'], maxLength: 1000 }
        buyer_instructions: { type: [string, 'null'], maxLength: 2000 }
      oneOf:
        - properties:
            legacy_policy_review: { const: true }
            policy_code: { type: 'null' }
            policy_version_number: { type: 'null' }
            resolved_locale: { type: 'null' }
            name: { type: 'null' }
            summary: { type: 'null' }
            buyer_instructions: { type: 'null' }
        - properties:
            legacy_policy_review: { const: false }
            policy_code: { $ref: '#/components/schemas/PublicCode' }
            policy_version_number: { type: integer, minimum: 1 }
            resolved_locale: { type: string, enum: [vi, zh, en] }
            name: { type: string, maxLength: 160 }
            summary: { type: string, maxLength: 1000 }
            buyer_instructions: { type: string, maxLength: 2000 }
    AfterSale:
      type: object
      additionalProperties: false
      required:
        [
          id,
          public_number,
          order_id,
          reason_code,
          reason_detail,
          type,
          status,
          currency,
          approved_refund_vnd,
          items,
          evidence,
          policy_snapshot,
          return_deadline_at,
          return_shipments,
          settlements,
          timeline,
          version,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        public_number:
          type: string
          pattern: '^ASC-[A-Z0-9]{16,32}$'
          description: At least 128 bits of server-generated random uppercase base32/hex entropy
        order_id: { type: string, format: uuid }
        reason_code: { $ref: '#/components/schemas/PublicCode' }
        reason_detail:
          type: [string, 'null']
          minLength: 10
          maxLength: 2000
          description: Nullable only for legacy stored cases; every new create request remains non-empty.
        type: { $ref: '#/components/schemas/AfterSaleType' }
        status: { $ref: '#/components/schemas/AfterSaleStatus' }
        currency: { type: string, const: VND }
        approved_refund_vnd: { type: integer, minimum: 0, maximum: 9007199254740991 }
        items: { type: array, items: { $ref: '#/components/schemas/AfterSaleItem' } }
        evidence: { type: array, maxItems: 6, items: { $ref: '#/components/schemas/EvidenceView' } }
        policy_snapshot: { $ref: '#/components/schemas/AfterSalePolicySnapshotView' }
        return_deadline_at: { type: [string, 'null'], format: date-time }
        return_shipments:
          { type: array, items: { $ref: '#/components/schemas/AfterSaleReturnShipmentView' } }
        settlements:
          { type: array, items: { $ref: '#/components/schemas/AfterSaleSettlementView' } }
        timeline: { type: array, items: { $ref: '#/components/schemas/AfterSaleTimelineEntry' } }
        evidence_count: { type: integer, minimum: 0, maximum: 6 }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AfterSalePage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AfterSale' } }
        next_cursor:
          oneOf:
            - { $ref: '#/components/schemas/OpaqueCursor' }
            - { type: 'null' }
    PolicyLocalization:
      type: object
      additionalProperties: false
      required: [buyer_instructions, locale, name, summary]
      properties:
        buyer_instructions: { type: string, minLength: 1, maxLength: 2000 }
        locale: { type: string, enum: [vi, zh, en] }
        name: { type: string, minLength: 1, maxLength: 160 }
        summary: { type: string, minLength: 1, maxLength: 1000 }
    PolicyLocalizations:
      type: array
      minItems: 3
      maxItems: 3
      uniqueItems: true
      items: { $ref: '#/components/schemas/PolicyLocalization' }
      allOf:
        - contains:
            type: object
            required: [locale]
            properties: { locale: { const: vi } }
          minContains: 1
          maxContains: 1
        - contains:
            type: object
            required: [locale]
            properties: { locale: { const: zh } }
          minContains: 1
          maxContains: 1
        - contains:
            type: object
            required: [locale]
            properties: { locale: { const: en } }
          minContains: 1
          maxContains: 1
    AfterSalePolicyConditionRules:
      type: object
      additionalProperties: false
      required:
        [evidence_required, evidence_required_reason_codes, opened_package_exception_reason_codes]
      properties:
        evidence_required: { type: boolean }
        evidence_required_reason_codes:
          type: array
          maxItems: 64
          uniqueItems: true
          items: { $ref: '#/components/schemas/PublicCode' }
        opened_package_exception_reason_codes:
          type: array
          maxItems: 64
          uniqueItems: true
          items: { $ref: '#/components/schemas/PublicCode' }
    AfterSalePolicyDraft:
      type: object
      additionalProperties: false
      description: >-
        The exchange_attribute_code is non-null exactly when allowed_types contains EXCHANGE.
        product_ids is a same-store replace-set that becomes effective only on atomic publish.
      required:
        [
          allowed_types,
          category_id,
          condition_rules,
          damaged_exception,
          defect_exception,
          exchange_attribute_code,
          exchange_same_product_only,
          expected_version,
          hygiene_restricted,
          localizations,
          product_ids,
          request_window_days,
          return_shipping_payer,
          return_window_days,
          unopened_required,
          wrong_item_exception,
        ]
      properties:
        allowed_types:
          {
            type: array,
            minItems: 1,
            maxItems: 4,
            uniqueItems: true,
            items: { $ref: '#/components/schemas/AfterSaleType' },
          }
        category_id: { type: [string, 'null'], format: uuid }
        condition_rules: { $ref: '#/components/schemas/AfterSalePolicyConditionRules' }
        damaged_exception: { type: boolean }
        defect_exception: { type: boolean }
        exchange_attribute_code:
          { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/PublicCode' }] }
        exchange_same_product_only: { type: boolean, const: true }
        expected_version: { type: integer, minimum: 0 }
        hygiene_restricted: { type: boolean }
        localizations: { $ref: '#/components/schemas/PolicyLocalizations' }
        product_ids:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
        request_window_days: { type: integer, minimum: 0, maximum: 365 }
        return_shipping_payer: { type: string, enum: [BUYER, MERCHANT, CONDITIONAL] }
        return_window_days: { type: integer, minimum: 1, maximum: 60 }
        unopened_required: { type: boolean }
        wrong_item_exception: { type: boolean }
    AfterSalePolicyContent:
      type: object
      additionalProperties: false
      description: >-
        Canonical immutable business content. exchange_attribute_code is non-null exactly when
        allowed_types contains EXCHANGE; optimistic-lock and command fields are excluded.
      required:
        [
          allowed_types,
          category_id,
          condition_rules,
          damaged_exception,
          defect_exception,
          exchange_attribute_code,
          exchange_same_product_only,
          hygiene_restricted,
          localizations,
          product_ids,
          request_window_days,
          return_shipping_payer,
          return_window_days,
          unopened_required,
          wrong_item_exception,
        ]
      properties:
        allowed_types:
          {
            type: array,
            minItems: 1,
            maxItems: 4,
            uniqueItems: true,
            items: { $ref: '#/components/schemas/AfterSaleType' },
          }
        category_id: { type: [string, 'null'], format: uuid }
        condition_rules: { $ref: '#/components/schemas/AfterSalePolicyConditionRules' }
        damaged_exception: { type: boolean }
        defect_exception: { type: boolean }
        exchange_attribute_code:
          { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/PublicCode' }] }
        exchange_same_product_only: { type: boolean, const: true }
        hygiene_restricted: { type: boolean }
        localizations: { $ref: '#/components/schemas/PolicyLocalizations' }
        product_ids:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
        request_window_days: { type: integer, minimum: 0, maximum: 365 }
        return_shipping_payer: { type: string, enum: [BUYER, MERCHANT, CONDITIONAL] }
        return_window_days: { type: integer, minimum: 1, maximum: 60 }
        unopened_required: { type: boolean }
        wrong_item_exception: { type: boolean }
    PolicyPublishRequest:
      type: object
