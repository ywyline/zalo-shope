        legacy_policy_review=true and no prior side effects, record a distinct append-only decision,
        and can execute exactly once. Legacy approval never backfills a current policy as historical;
        it freezes the reviewed policy basis and, for return-refund/exchange, the submitted one-time
        return window and shipping payer. The server rejects non-null return terms for non-return
