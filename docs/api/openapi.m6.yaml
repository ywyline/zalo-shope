      security: [{ MemberBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Privacy requests scoped to the current member and store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivacyRequestPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createMemberPrivacyRequest
      summary: Persist a privacy request intake without claiming that fulfillment is complete
      security: [{ MemberBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrivacyRequestCreateRequest' }
      responses:
        '201':
          description: A SUBMITTED privacy request fact; fulfillment remains an audited later process
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivacyRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/members/me/privacy-requests/{requestNumber}:
    get:
      operationId: getMemberPrivacyRequest
      summary: Get one current-member privacy request by its public number
      security: [{ MemberBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/PrivacyRequestNumber' }
      responses:
        '200':
          description: Current audited status without internal notes or other-member facts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivacyRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/members/me/privacy-requests/{requestNumber}/cancel:
    post:
      operationId: cancelMemberPrivacyRequest
      summary: Cancel a request only while its audited state still permits cancellation
      security: [{ MemberBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/PrivacyRequestNumber' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrivacyRequestCancelRequest' }
      responses:
        '200':
          description: Request is CANCELLED or the idempotent current fact is returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivacyRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/shares:
    post:
      operationId: createShareLink
      summary: Create an opaque, store-bound share link from a published target
      description: The client cannot provide a URL, title, image, member ID or store ID.
      security: [{ MemberBearer: [] }, {}]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShareCreateRequest' }
      responses:
        '201':
          description: Server-resolved card and links
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareCreation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/shares/{shortCode}:
    get:
      operationId: resolveShareLink
      summary: Resolve an opaque share link to a safe Mini App and browser target
      security: []
      parameters:
        - { $ref: '#/components/parameters/ShortCode' }
        - { $ref: '#/components/parameters/Locale' }
      responses:
        '200':
          description: Published target or safe store-home fallback
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareCard' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/shares/{shortCode}/outcome:
    post:
      operationId: recordShareOutcome
      summary: Record a user-driven share-sheet completion or cancellation
      description: >-
        The signed interaction token is issued only by share creation and is bound to the short
        code, initial interaction and expiry. Outcomes are idempotent analytics facts and never
        authorize rewards, commission, redirects or financial changes.
      security: []
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/ShortCode' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShareOutcomeRequest' }
      responses:
        '204': { description: Outcome recorded or idempotently replayed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /s/{shortCode}:
    get:
      operationId: renderShareFallback
      summary: Render escaped OG metadata and an explicit open-in-Zalo action
      security: []
      parameters:
        - { $ref: '#/components/parameters/ShortCode' }
      responses:
        '200':
          description: >-
            CSP-protected browser fallback with an explicit open action; no Location header,
            meta refresh or request-controlled redirect is permitted
          headers:
            Content-Security-Policy: { $ref: '#/components/headers/FallbackCsp' }
            X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
            Referrer-Policy: { $ref: '#/components/headers/NoReferrer' }
            Cache-Control: { $ref: '#/components/headers/PublicFallbackCache' }
          content:
            text/html:
              schema: { type: string }
        '404':
          description: Unknown code renders a static safe chooser without Location or meta refresh
          headers:
            Content-Security-Policy: { $ref: '#/components/headers/FallbackCsp' }
            X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
            Referrer-Policy: { $ref: '#/components/headers/NoReferrer' }
            Cache-Control: { $ref: '#/components/headers/PublicFallbackCache' }
components:
  securitySchemes:
    MemberBearer:
      type: http
      scheme: bearer
      bearerFormat: ZaloShopMemberToken
    AdminBearer:
      type: http
      scheme: bearer
      bearerFormat: ZaloShopAdminToken
  parameters:
    StoreCode:
      name: X-Store-Code
      in: header
      required: true
      schema: { type: string, minLength: 2, maxLength: 64, pattern: '^[a-z][a-z0-9-]*$' }
    StoreIdQuery:
      name: store_id
      in: query
      required: true
      schema: { type: string, format: uuid }
    AccessReason:
      name: X-Access-Reason
      in: header
      required: false
      description: >-
        Optional for a store-assigned administrator; required and audited when a platform
        administrator uses platform.stores.cross_access to enter the target store scope.
      schema: { type: string, minLength: 10, maxLength: 500 }
    ProtectedEvidenceAccessReason:
      name: X-Access-Reason
      in: header
      required: false
      description: >-
        Optional for a store-assigned administrator. A platform cross-store protected-evidence read
        requires exactly this safe incident reference; free text is rejected before either audit is
        written, so URLs, object keys, checksums and provider details cannot enter audit records.
      schema:
        type: string
        minLength: 32
        maxLength: 57
        pattern: '^Protected evidence incident [A-Z][A-Z0-9]{1,15}-[1-9][0-9]{0,11}$'
    CorrelationIdRequest:
      name: X-Correlation-Id
      in: header
      required: false
      description: >-
        Optional safe client correlation identifier. The response X-Correlation-Id is authoritative;
        unsafe supplied values are not propagated and are replaced with a server-generated value.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[!-~]+$' }
    AfterSaleId:
      name: afterSaleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EvidenceId:
      name: evidenceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SettlementNumber:
      name: settlementNumber
      in: path
      required: true
      schema: { type: string, pattern: '^AST-[A-Z0-9]{16,32}$' }
    ProductCode:
      name: productCode
      in: path
      required: true
      schema: { $ref: '#/components/schemas/PublicCode' }
    PolicyCode:
      name: policyCode
      in: path
      required: true
      schema: { $ref: '#/components/schemas/PublicCode' }
    PolicyVersionNumber:
      name: versionNumber
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ShortCode:
      name: shortCode
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ShortCode' }
    PrivacyRequestNumber:
      name: requestNumber
      in: path
      required: true
      schema: { type: string, pattern: '^PRV-[A-Z0-9]{16,32}$' }
    Cursor:
      name: cursor
      in: query
      description: >-
        c1_ token signed with a dedicated rotatable HMAC key and bound to schema version, store,
        authenticated subject type/id, resource, canonical filters, sort key/id and expiry. Any
        tampering, scope reuse or expiry returns the same stable 400 response.
      schema: { $ref: '#/components/schemas/OpaqueCursor' }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Locale:
      name: locale
      in: query
      schema: { type: string, enum: [vi, zh, en], default: vi }
    AdminLocale:
      name: locale
      in: query
      description: Omit to resolve the store default locale, then fall back to Vietnamese.
      schema: { type: string, enum: [vi, zh, en] }
  schemas:
    OpaqueCursor:
      type: string
      minLength: 23
      maxLength: 512
      pattern: '^c1_[A-Za-z0-9_-]{20,509}$'
      description: Syntax only; accepting the token also requires the scoped HMAC verification above.
    ShortCode:
      type: string
      minLength: 20
      maxLength: 128
      pattern: '^[A-Za-z0-9_-]+$'
    HttpsUrl:
      type: string
      format: uri
      pattern: '^https://'
    EvidenceUploadUrl:
      type: string
      format: uri
      pattern: '^https?://'
      description: Production configuration requires HTTPS; HTTP is accepted only by local/test storage.
    EvidenceReadUrl:
      type: string
      format: uri
      pattern: '^https?://'
      description: >-
        A short-lived S3-compatible protected-read URL whose expiry is bounded by the ordinary access,
        Bearer token and persisted session deadlines. Production configuration requires HTTPS; HTTP
        is accepted only by local/test storage.
    MiniAppPath:
      type: string
      pattern: '^/(?:\?locale=(?:vi|zh|en)|(?:brands|categories|products|promotions|coupons)/[a-z0-9]+(?:-[a-z0-9]+)*\?locale=(?:vi|zh|en))$'
    PublicCode:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
    AfterSaleType:
      type: string
      enum: [REFUND_ONLY, RETURN_REFUND, EXCHANGE, MERCHANT_REFUND]
    AfterSaleStatus:
      type: string
      enum:
        [
          PENDING_REVIEW,
          APPROVED,
          REJECTED,
          CANCELLED,
          RETURN_PENDING,
          RETURN_IN_TRANSIT,
          INSPECTION_PENDING,
          REFUND_PENDING,
          REFUND_PROCESSING,
          REFUNDED,
          EXCHANGE_PENDING,
          EXCHANGE_IN_TRANSIT,
          REVIEW_REQUIRED,
          COMPLETED,
        ]
    EvidenceUploadRequest:
      type: object
      additionalProperties: false
      required: [byte_size, checksum_sha256, filename, mime_type]
      properties:
        byte_size: { type: integer, minimum: 1, maximum: 52428800 }
        checksum_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        filename: { type: string, minLength: 1, maxLength: 255, pattern: '^[^/\\]+$' }
        mime_type: { type: string, enum: [image/jpeg, image/png, image/webp, video/mp4] }
      allOf:
        - if:
            properties:
              mime_type: { enum: [image/jpeg, image/png, image/webp] }
          then:
            properties:
              byte_size: { maximum: 10485760 }
    EvidenceUploadHeaders:
      type: object
      additionalProperties: false
      required: [content-type, if-none-match, x-amz-checksum-sha256]
      properties:
        content-type:
          type: string
          enum: [image/jpeg, image/png, image/webp, video/mp4]
        if-none-match: { const: '*' }
        x-amz-checksum-sha256:
          type: string
          pattern: '^[A-Za-z0-9+/]{43}=$'
        x-amz-server-side-encryption:
          type: string
          enum: [AES256, aws:kms]
        x-amz-server-side-encryption-aws-kms-key-id:
          type: string
          minLength: 1
          maxLength: 2048
      allOf:
        - if:
            required: [x-amz-server-side-encryption-aws-kms-key-id]
          then:
            required: [x-amz-server-side-encryption]
            properties:
              x-amz-server-side-encryption: { const: aws:kms }
        - if:
            properties:
              x-amz-server-side-encryption: { const: aws:kms }
            required: [x-amz-server-side-encryption]
          then:
            required: [x-amz-server-side-encryption-aws-kms-key-id]
    EvidenceUpload:
      type: object
      additionalProperties: false
      required: [evidence_id, upload_url, upload_headers, expires_at, version]
      properties:
        evidence_id: { type: string, format: uuid }
        upload_url: { $ref: '#/components/schemas/EvidenceUploadUrl' }
        upload_headers: { $ref: '#/components/schemas/EvidenceUploadHeaders' }
        expires_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    EvidenceConfirmRequest:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version: { type: integer, minimum: 1 }
    EvidenceView:
      type: object
      additionalProperties: false
      description: >-
        Safe public projection. Internal scan, quarantine and deletion states are collapsed into
        UNAVAILABLE so member and ordinary admin responses cannot reveal cleanup or security detail.
      required: [evidence_id, status, access_expires_at, version]
      properties:
        evidence_id: { type: string, format: uuid }
        status:
          type: string
          enum: [PENDING, READY, UNAVAILABLE]
        access_expires_at:
          type: [string, 'null']
          format: date-time
          description: >-
            Exclusive ordinary-access deadline; null when unavailable. A legal hold never extends it.
        version: { type: integer, minimum: 1 }
      oneOf:
        - properties:
            status: { const: READY }
            access_expires_at: { type: string, format: date-time }
        - properties:
            status: { enum: [PENDING, UNAVAILABLE] }
            access_expires_at: { type: 'null' }
    EvidenceAccess:
      type: object
      additionalProperties: false
      required: [url, expires_at]
      properties:
        url: { $ref: '#/components/schemas/EvidenceReadUrl' }
        expires_at: { type: string, format: date-time }
    AfterSaleCommandAcknowledgement:
      type: object
      additionalProperties: false
      description: >-
        Immutable acknowledgement reconstructed only from the completed operation result_summary.
        It intentionally does not project the mutable after-sale aggregate.
      required: [id, public_number, status, version]
      properties:
        id: { type: string, format: uuid }
        public_number: { type: string, pattern: '^ASC-[A-Z0-9]{16,32}$' }
        status:
          {
            type: string,
            enum:
              [
                PENDING_REVIEW,
                REVIEW_REQUIRED,
                APPROVED,
                RETURN_PENDING,
                RETURN_IN_TRANSIT,
                INSPECTION_PENDING,
                REFUND_PENDING,
                REFUND_PROCESSING,
                REFUNDED,
                EXCHANGE_PENDING,
                EXCHANGE_IN_TRANSIT,
                REJECTED,
                CANCELLED,
                COMPLETED,
              ],
          }
        version: { type: integer, minimum: 1 }
    AfterSaleStandardItemInput:
      type: object
      additionalProperties: false
      required: [order_item_id, quantity]
      properties:
        order_item_id: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 1000 }
    AfterSaleExchangeItemInput:
      type: object
      additionalProperties: false
      required: [order_item_id, quantity, replacement_sku_id]
      properties:
        order_item_id: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 1000 }
        replacement_sku_id: { type: string, format: uuid }
    RefundOnlyCreateRequest:
      type: object
      additionalProperties: false
      required: [description, evidence_ids, items, order_id, reason_code, type]
      properties:
        description: { type: string, minLength: 10, maxLength: 2000 }
        evidence_ids:
          { type: array, maxItems: 6, uniqueItems: true, items: { type: string, format: uuid } }
        items:
          {
            type: array,
            minItems: 1,
            maxItems: 20,
            items: { $ref: '#/components/schemas/AfterSaleStandardItemInput' },
          }
        order_id: { type: string, format: uuid }
        reason_code: { $ref: '#/components/schemas/PublicCode' }
        type: { type: string, const: REFUND_ONLY }
    ReturnRefundCreateRequest:
      type: object
      additionalProperties: false
      required: [description, evidence_ids, items, order_id, reason_code, type]
      properties:
        description: { type: string, minLength: 10, maxLength: 2000 }
        evidence_ids:
          { type: array, maxItems: 6, uniqueItems: true, items: { type: string, format: uuid } }
        items:
          {
            type: array,
            minItems: 1,
            maxItems: 20,
            items: { $ref: '#/components/schemas/AfterSaleStandardItemInput' },
          }
        order_id: { type: string, format: uuid }
        reason_code: { $ref: '#/components/schemas/PublicCode' }
        type: { type: string, const: RETURN_REFUND }
    ExchangeCreateRequest:
      type: object
      additionalProperties: false
      required: [description, evidence_ids, items, order_id, reason_code, type]
      properties:
        description: { type: string, minLength: 10, maxLength: 2000 }
        evidence_ids:
          { type: array, maxItems: 6, uniqueItems: true, items: { type: string, format: uuid } }
        items:
          {
            type: array,
            minItems: 1,
            maxItems: 20,
            items: { $ref: '#/components/schemas/AfterSaleExchangeItemInput' },
          }
        order_id: { type: string, format: uuid }
        reason_code: { $ref: '#/components/schemas/PublicCode' }
        type: { type: string, const: EXCHANGE }
    AfterSaleCreateRequest:
      oneOf:
        - { $ref: '#/components/schemas/RefundOnlyCreateRequest' }
        - { $ref: '#/components/schemas/ReturnRefundCreateRequest' }
        - { $ref: '#/components/schemas/ExchangeCreateRequest' }
      discriminator: { propertyName: type }
    MerchantAfterSaleCreateRequest:
      type: object
      additionalProperties: false
      required: [description, items, reason_code, type]
      properties:
        description: { type: string, minLength: 10, maxLength: 2000 }
        items:
          {
            type: array,
            minItems: 1,
            maxItems: 20,
            items: { $ref: '#/components/schemas/AfterSaleStandardItemInput' },
          }
        reason_code: { $ref: '#/components/schemas/PublicCode' }
        type: { type: string, const: MERCHANT_REFUND }
    VersionedReasonRequest:
      type: object
      additionalProperties: false
      required: [expected_version, reason]
      properties:
        expected_version: { type: integer, minimum: 1 }
        reason:
          type: string
          minLength: 10
          maxLength: 500
          description: Used for confirmation and idempotency only; the server stores a canonical non-sensitive cancellation reason, not this plaintext.
    ReturnShipmentRequest:
      type: object
      additionalProperties: false
      required: [carrier_name, expected_version, tracking_number]
      properties:
        carrier_name: { type: string, minLength: 2, maxLength: 160 }
        expected_version: { type: integer, minimum: 1 }
        tracking_number: { type: string, minLength: 2, maxLength: 160 }
    AfterSaleReturnFactRequest:
      type: object
      additionalProperties: false
      required:
        [confirmation_code, expected_return_shipment_version, expected_version, reason, status]
      properties:
        confirmation_code: { type: string, const: RECORD_RETURN_LOGISTICS_FACT }
        expected_return_shipment_version: { type: integer, minimum: 1 }
        expected_version: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 10, maxLength: 500 }
        status: { type: string, enum: [IN_TRANSIT, DELIVERED] }
    AfterSaleInspectionAllocation:
      type: object
      additionalProperties: false
      required: [disposition, quantity]
      properties:
        disposition: { type: string, enum: [RESTOCK_SELLABLE, QUARANTINE, SCRAP, RETURN_TO_MEMBER] }
        quantity: { type: integer, minimum: 1, maximum: 1000 }
    AfterSaleInspectionItem:
      type: object
      additionalProperties: false
      required: [dispositions, order_item_id]
      properties:
        dispositions:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          description: Each disposition may occur at most once for an order item.
          items: { $ref: '#/components/schemas/AfterSaleInspectionAllocation' }
        order_item_id: { type: string, format: uuid }
    AfterSaleInspectionRequest:
      type: object
      additionalProperties: false
      required: [confirmation_code, expected_inspection_version, expected_version, items, reason]
      properties:
        confirmation_code: { type: string, const: CONFIRM_RETURN_INSPECTION }
        expected_inspection_version: { type: integer, minimum: 0 }
        expected_version: { type: integer, minimum: 1 }
        items:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          description: >-
            Must contain each approved order item exactly once, with disposition quantities summing
            to that item's complete approved quantity.
          items: { $ref: '#/components/schemas/AfterSaleInspectionItem' }
        reason: { type: string, minLength: 10, maxLength: 500 }
    AfterSaleInspectionRestoredItem:
      type: object
      additionalProperties: false
      required: [order_item_id, quantity]
      properties:
        order_item_id: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 1000 }
    AfterSaleInspectionAcknowledgement:
      type: object
      additionalProperties: false
      required: [id, inspection_version, public_number, restored_items, status, version]
      properties:
        id: { type: string, format: uuid }
        inspection_version: { type: integer, minimum: 1 }
        public_number: { type: string, pattern: '^ASC-[A-Z0-9]{16,32}$' }
        restored_items:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/AfterSaleInspectionRestoredItem' }
        status: { type: string, enum: [REFUND_PENDING, EXCHANGE_PENDING, REJECTED] }
        version: { type: integer, minimum: 1 }
    AfterSaleApprovedItemInput:
      type: object
      additionalProperties: false
      required: [approved_quantity, order_item_id]
      properties:
        approved_quantity: { type: integer, minimum: 0, maximum: 1000 }
        order_item_id: { type: string, format: uuid }
    ApproveAfterSaleReviewRequest:
      type: object
      additionalProperties: false
      description: >-
        order_item_id values are unique and must exactly cover every requested case line. Each
        approved_quantity is bounded by that line's requested quantity and at least one is positive.
      required: [confirmation_code, decision, expected_version, items, reason]
      properties:
        confirmation_code: { type: string, const: APPROVE_AFTER_SALE }
        decision: { type: string, const: APPROVE }
        expected_version: { type: integer, minimum: 1 }
        items:
          {
            type: array,
            minItems: 1,
            maxItems: 20,
            items: { $ref: '#/components/schemas/AfterSaleApprovedItemInput' },
          }
        reason: { type: string, minLength: 10, maxLength: 500 }
    RejectAfterSaleReviewRequest:
      type: object
      additionalProperties: false
      required: [confirmation_code, decision, expected_version, reason]
