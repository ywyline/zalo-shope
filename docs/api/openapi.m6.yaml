openapi: 3.1.0
info:
  title: Zalo Shop M6 incremental API contract
  version: 0.6.3-b1
  description: >-
    M6 incremental contract combined with the M1-M5 contracts. M6.3-A implements only the
    after-sale settings GET/PUT routes. M6.3-B1 implements only the member/admin after-sale list and
    detail GET routes; all other after-sale operations assigned to M6.3-B2 through B7 remain
    contract-only. Buyer store ownership comes from the authenticated member and X-Store-Code.
    Admin routes additionally require the matching store_id query parameter. Every after-sale HTTP
    response carries the same X-Correlation-Id propagated through its transaction, transitions,
    audit and logs; error bodies repeat it as correlation_id.
x-after-sale-b0-contract:
  runtime_status: m6_3_a_settings_and_m6_3_b1_reads_implemented
  runtime_operations:
    implemented_m6_3_a: [getAfterSaleSettings, setAfterSalePolicyEnforcement]
    implemented_m6_3_b1:
      [listMemberAfterSales, getMemberAfterSale, listAdminAfterSales, getAdminAfterSale]
    contract_only_m6_3_b2_to_b7: all_after_sale_operations_not_listed_as_implemented_above
  list_sort:
    member: created_at_desc_then_id_desc
    admin: updated_at_desc_then_id_desc
  locale_resolution:
    member: authenticated_member_preferred_locale_then_vi
    admin: explicit_locale_then_store_default_then_vi
  cursor:
    prefix: c1_
    protection: dedicated_rotatable_hmac_key_ring_first_signs_all_verify
    binds: [version, store_id, subject_type, subject_id, resource, filters, sort_key, expires_at]
    tamper_response: 400
  rate_limits:
    window_seconds: 60
    member_read: { limit: 60, scope: 'store_id:member_id' }
    member_write: { limit: 10, scope: 'store_id:member_id' }
    admin_read: { limit: 120, scope: 'store_id:admin_id' }
    admin_write: { limit: 30, scope: 'store_id:admin_id' }
    runtime:
      member_read: implemented_m6_3_b1
      admin_read: implemented_m6_3_b1
      member_write: contract_only_m6_3_b2_to_b7
      admin_write: contract_only_m6_3_b2_to_b7
    read_limiter_unavailable_response: 503_fail_closed_without_retry_after_contract
  system_principal:
    scope: after-sale-transition
    events:
      [RETURN_EXPIRED, REFUND_SUCCEEDED, REFUND_FAILED, REFUND_CANCELLED, REQUIRE_REVIEW, COMPLETE]
    forbidden_events:
      [APPROVE, REJECT, LEGACY_APPROVE, LEGACY_REJECT, RESUME_REVIEW, REFUND_REQUESTED]
    complete_rule: deterministic_REFUNDED_to_COMPLETED_without_new_fund_side_effect
servers:
  - url: https://api.example.invalid
paths:
  /v1/after-sales/evidence-uploads:
    post:
      operationId: initializeAfterSaleEvidenceUpload
      x-runtime-status: contract_only_m6_3_b2_to_b7
      x-rate-limit-tier: member_write
      summary: Initialize a private evidence upload for the current member and store
      security: [{ MemberBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvidenceUploadRequest' }
      responses:
        '201':
          description: Private upload target; object is unreadable until confirmed and scanned
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
            Referrer-Policy: { $ref: '#/components/headers/NoReferrer' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceUpload' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/after-sales/evidence-uploads/{evidenceId}/confirm:
    post:
      operationId: confirmAfterSaleEvidenceUpload
      x-runtime-status: contract_only_m6_3_b2_to_b7
      x-rate-limit-tier: member_write
      summary: Confirm object metadata and request scanning
      security: [{ MemberBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/EvidenceId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvidenceConfirmRequest' }
      responses:
        '202':
          description: Evidence is pending scanning
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/after-sales:
    get:
      operationId: listMemberAfterSales
      x-runtime-status: implemented_m6_3_b1
      x-rate-limit-tier: member_read
      summary: List the current member's after-sale cases
      description: >-
        Policy text resolves with authenticated preferredLocale and then Vietnamese. Results are
        always ordered by created_at DESC, id DESC; cursor seek uses the same immutable tuple.
      security: [{ MemberBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/CorrelationIdRequest' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/AfterSaleType' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/AfterSaleStatus' } }
      responses:
        '200':
          description: Member-scoped cases
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AfterSalePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/AfterSaleReadLimiterUnavailable' }
    post:
      operationId: createAfterSale
      x-runtime-status: contract_only_m6_3_b2_to_b7
      x-rate-limit-tier: member_write
      summary: Submit a refund-only, return-refund, or equivalent exchange request
      description: >-
        Amount, policy result, state, refund, inventory and store facts are server-owned. Eligibility
        derives each requested order line's delivered_at only from its delivered ORDER_OUTBOUND
        shipment_items; conflicting or unprovable legacy delivery facts enter audited manual review
        and are never inferred from current time or order timestamps. All lines in one non-legacy
        case must resolve to the same policy id, version and canonical payload hash; different
        policies require separate cases. If that policy/reason requires evidence, creation fails
        closed unless real magic-byte/type/size/count upload validation, malware scanning, READY
        evidence claim, protected retrieval and deletion compensation capabilities are all available.
      security: [{ MemberBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AfterSaleCreateRequest' }
      responses:
        '201':
          description: Submitted case
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AfterSale' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/after-sales/{afterSaleId}:
    get:
      operationId: getMemberAfterSale
      x-runtime-status: implemented_m6_3_b1
      x-rate-limit-tier: member_read
      summary: Get the current member's case and public timeline
      description: Policy text resolves with authenticated preferredLocale and then Vietnamese.
      security: [{ MemberBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/CorrelationIdRequest' }
        - { $ref: '#/components/parameters/AfterSaleId' }
      responses:
        '200':
          description: Member-safe case detail
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AfterSale' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/AfterSaleReadLimiterUnavailable' }
  /v1/after-sales/{afterSaleId}/cancel:
    post:
      operationId: cancelMemberAfterSale
      x-runtime-status: contract_only_m6_3_b2_to_b7
      x-rate-limit-tier: member_write
      summary: Cancel a case that is still pending review
      security: [{ MemberBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/AfterSaleId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionedReasonRequest' }
      responses:
        '200':
          description: Current case; an idempotent replay returns the same fact
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AfterSale' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/after-sales/{afterSaleId}/return-shipment:
    post:
      operationId: submitAfterSaleReturnShipment
      x-runtime-status: contract_only_m6_3_b2_to_b7
      x-rate-limit-tier: member_write
      summary: Submit buyer-provided return tracking without treating it as provider truth
      description: >-
        On the first valid submission from APPROVED, one transaction records and occupies a
        SUBMITTED member-provided return shipment and appends only START_RETURN, moving the case to
        RETURN_PENDING before the exclusive return_deadline_at. The member command cannot append
        RETURN_SHIPPED or assert IN_TRANSIT/DELIVERED. Only later verified logistics or audited
        administrator facts may append RETURN_SHIPPED/RETURN_RECEIVED. Idempotent replay creates no
        duplicate record or transition.
      security: [{ MemberBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/AfterSaleId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnShipmentRequest' }
      responses:
        '200':
          description: Return record submitted and case moved only to RETURN_PENDING
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AfterSale' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/after-sales/{afterSaleId}/evidence/{evidenceId}:
    get:
      operationId: getMemberAfterSaleEvidence
      x-runtime-status: contract_only_m6_3_b2_to_b7
      x-rate-limit-tier: member_read
      summary: Get a short-lived no-store URL for the current member's scanned evidence
      description: >-
        Access is issued only while the claimed object is READY and before access_expires_at.
        Expired, failed, quarantined, deletion-pending and deleted objects return the same not-found
        response. A legal hold can retain bytes but never extends this member access window.
      security: [{ MemberBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/AfterSaleId' }
        - { $ref: '#/components/parameters/EvidenceId' }
      responses:
        '200':
          description: Member-scoped private evidence access
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
            Referrer-Policy: { $ref: '#/components/headers/NoReferrer' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceAccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/admin/orders/{orderId}/after-sales:
    post:
      operationId: createMerchantAfterSale
      x-runtime-status: contract_only_m6_3_b2_to_b7
      x-rate-limit-tier: admin_write
      summary: Create an audited merchant-initiated refund case for one order
      description: The server calculates all refundable amounts and resolves the member and store.
      security: [{ AdminBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/StoreIdQuery' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MerchantAfterSaleCreateRequest' }
      responses:
        '201':
          description: Merchant-initiated case; no refund has yet been claimed successful
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AfterSale' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/admin/after-sales:
    get:
      operationId: listAdminAfterSales
      x-runtime-status: implemented_m6_3_b1
      x-rate-limit-tier: admin_read
      summary: List after-sale cases for one authorized store
      description: >-
        Results are always ordered by updated_at DESC, id DESC, and cursor seek uses that same
        ordering tuple. Because updated_at can change between page requests, clients that need a
        refreshed view restart from the first page. Policy text resolves with explicit locale, then
        the store default, then Vietnamese. Platform cross-store access additionally requires an
        audited X-Access-Reason.
      security: [{ AdminBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/StoreIdQuery' }
        - { $ref: '#/components/parameters/AccessReason' }
        - { $ref: '#/components/parameters/CorrelationIdRequest' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/AdminLocale' }
        - { name: order_id, in: query, schema: { type: string, format: uuid } }
        - { name: member_id, in: query, schema: { type: string, format: uuid } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/AfterSaleType' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/AfterSaleStatus' } }
      responses:
        '200':
          description: Store-scoped cases; evidence content is not included
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AfterSalePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/AfterSaleReadLimiterUnavailable' }
  /v1/admin/after-sales/{afterSaleId}:
    get:
      operationId: getAdminAfterSale
      x-runtime-status: implemented_m6_3_b1
      x-rate-limit-tier: admin_read
      summary: Read one store-scoped case without private evidence bytes
      description: >-
        Platform cross-store access additionally requires an audited X-Access-Reason. Policy text
        resolves with explicit locale, then the store default, then Vietnamese.
      security: [{ AdminBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/StoreIdQuery' }
        - { $ref: '#/components/parameters/AccessReason' }
        - { $ref: '#/components/parameters/CorrelationIdRequest' }
        - { $ref: '#/components/parameters/AfterSaleId' }
        - { $ref: '#/components/parameters/AdminLocale' }
      responses:
        '200':
          description: Admin case detail
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AfterSale' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/AfterSaleReadLimiterUnavailable' }
  /v1/admin/after-sales/{afterSaleId}/review:
    post:
      operationId: reviewAfterSale
      x-runtime-status: contract_only_m6_3_b2_to_b7
      x-rate-limit-tier: admin_write
      summary: Approve or reject after policy and order fact checks
      description: >-
        This initial review command accepts only a non-legacy case in PENDING_REVIEW and appends
        APPROVE or REJECT. APPROVE supplies one approved_quantity decision for every requested
        order line; at least one is positive, none exceeds requested quantity, and the server locks
        order lines and applies the frozen integer-VND remainder algorithm. A case created directly
        in REVIEW_REQUIRED because its order lacks a trustworthy policy snapshot must use
        resolve-review with LEGACY_APPROVE or LEGACY_REJECT; the paths cannot be interchanged.
      security: [{ AdminBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/StoreIdQuery' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/AfterSaleId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AfterSaleReviewRequest' }
      responses:
        '200':
          description: Reviewed case
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AfterSale' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/admin/after-sales/{afterSaleId}/refund:
    post:
      operationId: requestAfterSaleRefund
      x-runtime-status: contract_only_m6_3_b2_to_b7
      x-rate-limit-tier: admin_write
      summary: Request server-calculated ONLINE or COD settlement
      description: >-
        ONLINE reuses the M5 refund capacity and outbox. COD creates a pending dual-control
        settlement and is never immediately marked successful. The server branches only from the
        trusted order payment method: ONLINE requires after-sales review plus M5 refund-create
        permission; COD requires the independent COD-refund-request permission. The client cannot
        select the payment branch. From APPROVED, both branches first append QUEUE_REFUND. ONLINE
        then atomically creates the M5 refund/outbox fact and appends REFUND_REQUESTED; a
        return-refund already at REFUND_PENDING appends only REFUND_REQUESTED. COD remains at
        REFUND_PENDING until independently confirmed. Idempotent replay appends no duplicate event.
      security: [{ AdminBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/StoreIdQuery' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/AfterSaleId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AfterSaleRefundRequest' }
      responses:
        '202':
          description: >-
            Refund or COD settlement is pending; no client amount is accepted. The returned
            settlements include the public_number required by the separate COD confirmation route.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AfterSale' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/admin/after-sales/{afterSaleId}/exchange:
    post:
      operationId: createAfterSaleExchange
      x-runtime-status: contract_only_m6_3_b2_to_b7
      x-rate-limit-tier: admin_write
      summary: Reserve and start an equal-quantity replacement SKU fulfillment
      security: [{ AdminBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/StoreIdQuery' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/AfterSaleId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AfterSaleExchangeRequest' }
      responses:
        '202':
          description: Replacement inventory is reserved or the command failed closed
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AfterSale' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/admin/after-sales/{afterSaleId}/convert-exchange-to-refund:
    post:
      operationId: convertAfterSaleExchangeToRefund
      x-runtime-status: contract_only_m6_3_b2_to_b7
      x-rate-limit-tier: admin_write
      summary: Convert an inspected exchange to a refund before replacement fulfillment starts
      description: >-
        Requires after-sales exchange plus review permission and recent MFA. The server proves no
        replacement shipment or unreleased reservation exists, appends CONVERT_EXCHANGE_TO_REFUND
        and keeps all return, inspection and inventory history. A later refund command applies the
        trusted ONLINE/COD branch and permissions; this command cannot submit an amount.
      security: [{ AdminBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/StoreIdQuery' }
