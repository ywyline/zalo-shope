        hygiene_restricted: { type: boolean }
        localizations: { $ref: '#/components/schemas/PolicyLocalizations' }
        product_ids:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
        request_window_days: { type: integer, minimum: 0, maximum: 365 }
        return_shipping_payer: { type: string, enum: [BUYER, MERCHANT, CONDITIONAL] }
        return_window_days: { type: integer, minimum: 1, maximum: 60 }
        unopened_required: { type: boolean }
