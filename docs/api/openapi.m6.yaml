        partial or zero-quantity inspection cannot advance the aggregate.
      required: [dispositions, order_item_id, received_quantity]
      properties:
        dispositions:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items: { $ref: '#/components/schemas/InspectionDisposition' }
        order_item_id: { type: string, format: uuid }
        received_quantity: { type: integer, minimum: 1, maximum: 1000 }
    AfterSaleInspectionRequest:
      type: object
      additionalProperties: false
      description: >-
        order_item_id values are unique and the item set exactly covers all approved lines awaiting
        inspection. Within each item, disposition codes are unique and quantities sum exactly to
        received_quantity. These server constraints apply even where JSON Schema uniqueItems alone
        cannot express key uniqueness or sums.
      required: [confirmation_code, expected_version, items, reason]
      properties:
        confirmation_code: { type: string, const: INSPECT_RETURN }
        expected_version: { type: integer, minimum: 1 }
        items:
          {
            type: array,
            minItems: 1,
            maxItems: 20,
            items: { $ref: '#/components/schemas/InspectionItem' },
          }
        reason: { type: string, minLength: 10, maxLength: 500 }
