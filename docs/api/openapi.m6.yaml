      properties:
        code: { $ref: '#/components/schemas/PublicCode' }
        version_number: { type: integer, minimum: 1 }
        effective_at: { type: string, format: date-time }
        content: { $ref: '#/components/schemas/AfterSalePolicyContent' }
        payload_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
        published_at: { type: string, format: date-time }
    AfterSalePolicyVersionPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AfterSalePolicyVersion' } }
        next_cursor:
          oneOf:
            - { $ref: '#/components/schemas/OpaqueCursor' }
            - { type: 'null' }
    AfterSalePolicyPage:
      type: object
      additionalProperties: false
