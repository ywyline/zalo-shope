openapi: 3.1.0
info:
  title: Zalo Shop M6 incremental API contract
  version: 0.6.4-a
  description: >-
    M6 incremental contract combined with the M1-M5 contracts. M6.3-A implements the after-sale
    settings GET/PUT routes, M6.3-B1 implements the member/admin after-sale list and detail GET
    routes, M6.3-B2a implements the seven administrator policy-control operations, and
    M6.3-B2b-D3 implements member evidence initialization, confirmation and owner status reads;
    M6.3-B2b-D4 deletion worker has repository implementation and local/test validation.
    M6.3-B2b-D5 has completed default-disabled repository implementation and local/test validation
    for member and administrator protected evidence reads, including migrations 44-48 and final
    commit-deadline revalidation. M6.3-B3 implements the three after-sale create/cancel commands.
    M6.3-B4 implements administrator review, one-time legacy/manual review resolution and the
    return-expiration worker. M6.3-B5 implements member return registration, audited trusted
    return-logistics facts and reuse of the B1 inspection-pending read projection. M6.3-B6 implements
    the server-calculated ONLINE settlement, M5 refund/link atomic coordinator and versioned
    after-sale refund synchronization worker. M6.3-B7 extends the shared refund route with a
    server-selected COD branch backed by exact matched COD remittance facts, then implements an
    encrypted receipt-recording route and a different-administrator confirmation route. M6.4
    Slice A implements complete return inspection and exactly-once sellable inventory restoration;
    replacement reservation and EXCHANGE_OUTBOUND fulfillment remain contract-only. These
    capabilities remain behind independent
    repository/local-test-only, default-disabled gates. This does not
    establish production readiness: legal-hold/dead-letter management, external alerting,
    production TTL policy, IAM/KMS/versioning/Object
    Lock/lifecycle certification, bearer-URL risk acceptance, deployment and rollout remain
    NOT_AUTHORIZED / NOT_RUN. Operations assigned to later milestones remain contract-only.
    Buyer store ownership comes from the authenticated member and X-Store-Code. Admin routes
    additionally require the matching store_id query parameter. D5 protected-read routes generate
    X-Correlation-Id on the server and do not accept a client correlation identifier; the generated
    value is propagated through authorization, audit, logs and error bodies.
x-after-sale-b0-contract:
  runtime_status: m6_3_a_b1_b2a_d3_d5_b3_b4_b5_b6_b7_and_m6_4_slice_a_repository_local_test_implemented
  runtime_operations:
    implemented_m6_3_a: [getAfterSaleSettings, setAfterSalePolicyEnforcement]
    implemented_m6_3_b1:
      [listMemberAfterSales, getMemberAfterSale, listAdminAfterSales, getAdminAfterSale]
    implemented_m6_3_b2a:
      [
        listAfterSalePolicies,
        getAfterSalePolicy,
        putAfterSalePolicyDraft,
        listAfterSalePolicyVersions,
        getAfterSalePolicyVersion,
        publishAfterSalePolicy,
        disableAfterSalePolicy,
      ]
    implemented_m6_3_b2b_d3:
      [
        initializeAfterSaleEvidenceUpload,
        confirmAfterSaleEvidenceUpload,
        getAfterSaleEvidenceUpload,
      ]
    implemented_m6_3_b2b_d5: [getMemberAfterSaleEvidence, getAdminAfterSaleEvidence]
    implemented_m6_3_b3: [createAfterSale, cancelMemberAfterSale, createMerchantAfterSale]
    implemented_m6_3_b4: [reviewAfterSale, resolveAfterSaleManualReview]
    implemented_m6_3_b5: [submitAfterSaleReturnShipment, recordAfterSaleReturnFact]
    implemented_m6_3_b6: [requestAfterSaleRefund]
    implemented_m6_3_b7:
      [requestAfterSaleRefund, recordAfterSaleCodRefundReceipt, confirmAfterSaleCodRefund]
    implemented_m6_4_slice_a: [inspectAfterSaleReturn]
    contract_only_m6_3_b2_m6_4_slice_b_and_later: all_after_sale_operations_not_listed_as_implemented_above
  protected_evidence_read:
    status: complete_repository_local_test_default_disabled
    repository_gates: pass
    migration_range: '44-48'
    authorization_deadline: earliest_of_ordinary_access_bearer_token_and_persisted_session
    commit_revalidation: post_lock_and_post_admin_audit_with_finalization_margin
    correlation_id: server_generated_client_input_not_accepted
    admin_audit_source_ip: normalized_trusted_request_peer
    production_status: not_authorized_not_run
  list_sort:
    member: created_at_desc_then_id_desc
    admin: updated_at_desc_then_id_desc
    policy_heads: updated_at_desc_then_id_desc
    policy_versions: published_at_desc_then_id_desc
  locale_resolution:
    member: authenticated_member_preferred_locale_then_vi
    admin: explicit_locale_then_store_default_then_vi
  cursor:
    prefix: c1_
    protection: dedicated_rotatable_hmac_key_ring_first_signs_all_verify
    binds: [version, store_id, subject_type, subject_id, resource, filters, sort_key, expires_at]
    tamper_response: 400
  rate_limits:
    window_seconds: 60
    member_read: { limit: 60, scope: 'store_id:member_id' }
    member_write: { limit: 10, scope: 'store_id:member_id' }
    admin_read: { limit: 120, scope: 'store_id:admin_id' }
    admin_write: { limit: 30, scope: 'store_id:admin_id' }
    runtime:
      member_read: implemented_m6_3_b1_m6_3_b2b_d3_and_d5
      admin_read: implemented_m6_3_b1_m6_3_b2a_and_m6_3_b2b_d5
      member_write: implemented_m6_3_b2b_d3_b3_and_b5
      admin_write: implemented_m6_3_b2a_b3_b4_b5_b6_b7_and_m6_4_slice_a
    read_limiter_unavailable_response: 503_fail_closed_without_retry_after_contract
    write_limiter_unavailable_response: 503_fail_closed_without_retry_after_contract
  b3_commands:
    status: complete_repository_local_test_default_disabled
    repository_gates: pass
    production_status: not_authorized_not_run_and_rejected_by_runtime_configuration
    admin_authorization: direct_target_store_review_only_cross_access_only_forbidden
    cod_admission: exact_matched_cod_remittance_for_the_same_store_order_shipment_and_amount
    command_response: immutable_operation_acknowledgement_get_reads_current_aggregate
    serialization_attempts: maximum_three_expected_version_conflict_not_retried
    creation_transition: SUBMIT_null_to_pending_review_or_legacy_review_required
    evidence_ttl_baseline: local_test_30_day_ordinary_90_day_retention
  b4_review_and_expiration:
    status: complete_repository_local_test_default_disabled
    repository_gates: pass
    migration_range: '50-51'
    production_status: not_authorized_not_run_and_rejected_by_runtime_configuration
    review_gate: AFTER_SALE_REVIEW_COMMANDS_ENABLED_false
    expiration_gate: AFTER_SALE_RETURN_EXPIRATION_WORKER_ENABLED_false
    admin_authorization: direct_target_store_review_only_recent_mfa_cross_access_only_forbidden
    merchant_refund_review: different_administrator_required
    command_response: immutable_operation_acknowledgement_get_reads_current_aggregate
    expiration_actor: dedicated_SYSTEM_after_sale_transition_scope
    excluded_side_effects: refund_cod_return_logistics_inspection_inventory_exchange
  b5_return_trust:
    status: complete_repository_local_test_default_disabled
    repository_gates: pass
    migration_range: '52'
    production_status: not_authorized_not_run_and_rejected_by_runtime_configuration
    return_gate: AFTER_SALE_RETURN_COMMANDS_ENABLED_false
    tracking_storage: keyed_hmac_and_mask_only_plaintext_forbidden
    member_transition: SUBMITTED_and_START_RETURN_only
    admin_authorization: direct_target_store_review_only_recent_mfa_cross_access_only_forbidden
    admin_confirmation: RECORD_RETURN_LOGISTICS_FACT
    trusted_statuses: [IN_TRANSIT, DELIVERED]
    delivered_projection: INSPECTION_PENDING_not_inspection_completed
    command_response: immutable_operation_acknowledgement_get_reads_current_aggregate
    excluded_side_effects: provider_calls_inspection_inventory_refund_cod_exchange
  b6_online_refund:
    status: complete_repository_local_test_default_disabled
    repository_gates: pass
    migration_range: none_reuses_m6_2_and_b0_guards
    production_status: not_authorized_not_run_and_rejected_by_runtime_configuration
    command_gate: AFTER_SALE_REFUND_COMMANDS_ENABLED_false
    admin_authorization: direct_target_store_after_sale_review_refund_create_after_sale_read_refund_read_recent_mfa_cross_access_only_forbidden
    amount_authority: server_approved_total_vnd_and_m5_remaining_capacity
    transaction: serializable_settlement_m5_refund_unique_link_transitions_audit_and_sync_outbox
    provider_projection: succeeded_failed_cancelled_or_review_required_from_locked_m5_refund
    excluded_side_effects: real_provider_cod_inspection_inventory_exchange_ui_rollout
  b7_cod_refund:
    status: complete_repository_local_test_default_disabled
    repository_gates: pass
    migration_range: '56'
    production_status: not_authorized_not_run_and_rejected_by_runtime_configuration
    command_gate: AFTER_SALE_REFUND_COMMANDS_ENABLED_false
    admission: exact_immutable_cod_remittance_matched_fact_for_delivered_order_outbound_shipment
    request_authorization: direct_target_store_after_sale_read_and_cod_refund_request_recent_mfa
    receipt_authorization: requester_with_direct_target_store_after_sale_read_and_cod_refund_request_recent_mfa
    confirmation_authorization: different_admin_with_direct_target_store_after_sale_read_and_cod_refund_confirm_recent_mfa
    amount_authority: server_approved_total_vnd_only_client_amount_forbidden
    receipt_storage: keyed_digests_mask_and_encrypted_evidence_plaintext_not_projected
    transaction: serializable_pending_settlement_receipt_then_atomic_success_transitions_confirmation_and_audit
    excluded_side_effects: real_bank_transfer_provider_calls_inventory_inspection_exchange_ui_rollout
  m6_4_slice_a_return_inspection:
    status: complete_repository_local_test_default_disabled
    repository_gates: pass
    migration_range: '57'
    production_status: not_authorized_not_run_and_rejected_by_runtime_configuration
    command_gate: AFTER_SALE_FULFILLMENT_COMMANDS_ENABLED_false
    admin_authorization: direct_target_store_after_sale_inspect_recent_mfa_plus_inventory_adjust_for_sellable_restore
    input_authority: complete_approved_order_item_coverage_no_client_sku_warehouse_amount_or_status
    dispositions: [RESTOCK_SELLABLE, QUARANTINE, SCRAP, RETURN_TO_MEMBER]
    inventory_restore: exactly_once_original_consumed_reservation_single_authoritative_warehouse
    result_statuses: [REFUND_PENDING, EXCHANGE_PENDING, REJECTED]
    excluded_side_effects: replacement_reservation_exchange_outbound_provider_calls_ui_rollout
  system_principal:
    scope: after-sale-transition
    events:
      [RETURN_EXPIRED, REFUND_SUCCEEDED, REFUND_FAILED, REFUND_CANCELLED, REQUIRE_REVIEW, COMPLETE]
    forbidden_events:
      [APPROVE, REJECT, LEGACY_APPROVE, LEGACY_REJECT, RESUME_REVIEW, REFUND_REQUESTED]
    complete_rule: deterministic_REFUNDED_to_COMPLETED_without_new_fund_side_effect
servers:
  - url: https://api.example.invalid
paths:
  /v1/after-sales/evidence-uploads:
    post:
      operationId: initializeAfterSaleEvidenceUpload
      x-runtime-status: implemented_m6_3_b2b_d3_default_disabled
      x-rate-limit-tier: member_write
      summary: Initialize a private evidence upload for the current member and store
      security: [{ MemberBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvidenceUploadRequest' }
      responses:
        '201':
          description: Private upload target; object is unreadable until confirmed and scanned
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
            Referrer-Policy: { $ref: '#/components/headers/NoReferrer' }
            Idempotency-Replayed: { schema: { type: boolean } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceUpload' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/after-sales/evidence-uploads/{evidenceId}:
    get:
      operationId: getAfterSaleEvidenceUpload
      x-runtime-status: implemented_m6_3_b2b_d3_default_disabled
      x-rate-limit-tier: member_read
      summary: Read the current member's safe evidence processing status
      description: >-
        PENDING, READY_UNCLAIMED and all security or cleanup states are projected only as
        PENDING, READY or UNAVAILABLE. Object identity, provider metadata, scan details and cleanup
        reasons are never returned. The exclusive READY deadline is the unclaimed claim deadline;
        legal hold never extends it.
      security: [{ MemberBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/EvidenceId' }
      responses:
        '200':
          description: Owner-scoped safe evidence status
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
            Referrer-Policy: { $ref: '#/components/headers/NoReferrer' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/after-sales/evidence-uploads/{evidenceId}/confirm:
    post:
      operationId: confirmAfterSaleEvidenceUpload
      x-runtime-status: implemented_m6_3_b2b_d3_default_disabled
      x-rate-limit-tier: member_write
      summary: Confirm object metadata and request scanning
      security: [{ MemberBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/EvidenceId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvidenceConfirmRequest' }
      responses:
        '202':
          description: Evidence is pending scanning
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
            Referrer-Policy: { $ref: '#/components/headers/NoReferrer' }
            Idempotency-Replayed: { schema: { type: boolean } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/after-sales:
    get:
      operationId: listMemberAfterSales
      x-runtime-status: implemented_m6_3_b1
      x-rate-limit-tier: member_read
      summary: List the current member's after-sale cases
      description: >-
        Policy text resolves with authenticated preferredLocale and then Vietnamese. Results are
        always ordered by created_at DESC, id DESC; cursor seek uses the same immutable tuple.
      security: [{ MemberBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/CorrelationIdRequest' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/AfterSaleType' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/AfterSaleStatus' } }
      responses:
        '200':
          description: Member-scoped cases
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AfterSalePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/AfterSaleReadLimiterUnavailable' }
    post:
      operationId: createAfterSale
      x-runtime-status: implemented_m6_3_b3_repository_local_test_default_disabled
      x-rate-limit-tier: member_write
      summary: Submit a refund-only, return-refund, or equivalent exchange request
      description: >-
        Amount, policy result, state, refund, inventory and store facts are server-owned. Eligibility
        derives each requested order line's delivered_at only from its delivered ORDER_OUTBOUND
        shipment_items; conflicting or unprovable legacy delivery facts enter audited manual review
        and are never inferred from current time or order timestamps. All lines in one non-legacy
        case must resolve to the same policy id, version and canonical payload hash; different
        policies require separate cases. If that policy/reason requires evidence or the request
        carries a non-empty evidence_ids array, creation fails closed unless real
        magic-byte/type/size/count upload
        validation, malware scanning, READY evidence claim, protected retrieval and deletion
        compensation capabilities are all available. The current repository has no authoritative COD
        confirmed-receipt fact, so COD creation fails closed.
      security: [{ MemberBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AfterSaleCreateRequest' }
      responses:
        '201':
          description: >-
            Stable command acknowledgement. An idempotent replay returns the original operation
            result even if the case aggregate has since changed; use GET for the current projection.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
            Idempotency-Replayed: { schema: { type: boolean } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AfterSaleCommandAcknowledgement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/AfterSaleWriteLimiterUnavailable' }
  /v1/after-sales/{afterSaleId}:
    get:
      operationId: getMemberAfterSale
      x-runtime-status: implemented_m6_3_b1
      x-rate-limit-tier: member_read
      summary: Get the current member's case and public timeline
      description: Policy text resolves with authenticated preferredLocale and then Vietnamese.
      security: [{ MemberBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/CorrelationIdRequest' }
        - { $ref: '#/components/parameters/AfterSaleId' }
      responses:
        '200':
          description: Member-safe case detail
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AfterSale' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/AfterSaleReadLimiterUnavailable' }
  /v1/after-sales/{afterSaleId}/cancel:
    post:
      operationId: cancelMemberAfterSale
      x-runtime-status: implemented_m6_3_b3_repository_local_test_default_disabled
      x-rate-limit-tier: member_write
      summary: Cancel a case that is still pending review
      security: [{ MemberBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/AfterSaleId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionedReasonRequest' }
      responses:
        '200':
          description: >-
            Stable cancellation acknowledgement. An idempotent replay returns the original
            cancellation result; use GET for the current case projection.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
            Idempotency-Replayed: { schema: { type: boolean } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AfterSaleCommandAcknowledgement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/AfterSaleWriteLimiterUnavailable' }
  /v1/after-sales/{afterSaleId}/return-shipment:
    post:
      operationId: submitAfterSaleReturnShipment
      x-runtime-status: implemented_m6_3_b5_repository_local_test_default_disabled
      x-rate-limit-tier: member_write
      summary: Submit buyer-provided return tracking without treating it as provider truth
      description: >-
        On the first valid submission from APPROVED, one transaction records and occupies a
        SUBMITTED member-provided return shipment and appends only START_RETURN, moving the case to
        RETURN_PENDING before the exclusive return_deadline_at. The member command cannot append
        RETURN_SHIPPED or assert IN_TRANSIT/DELIVERED. Only later verified logistics or audited
        administrator facts may append RETURN_SHIPPED/RETURN_RECEIVED. The tracking number is
        persisted only as a keyed HMAC and a display mask; plaintext is not returned in the
        acknowledgement, audit or operation result. Idempotent replay creates no duplicate record or
        transition. Production configuration rejects this repository capability.
      security: [{ MemberBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/AfterSaleId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnShipmentRequest' }
      responses:
        '200':
          description: >-
            Immutable acknowledgement after the case moves only to RETURN_PENDING; use the B1 GET
            route for the masked return projection and current aggregate.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
            Idempotency-Replayed: { schema: { type: boolean } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AfterSaleCommandAcknowledgement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/AfterSaleWriteLimiterUnavailable' }
  /v1/after-sales/{afterSaleId}/evidence/{evidenceId}:
    get:
      operationId: getMemberAfterSaleEvidence
      x-runtime-status: implemented_m6_3_b2b_d5_default_disabled
      x-rate-limit-tier: member_read
      summary: Get a short-lived no-store URL for the current member's scanned evidence
      description: >-
        Access is issued only while the claimed ORIGINAL object is READY and strictly before its
        ordinary_access_deadline_at. The URL is no-store/no-referrer, short lived and expires strictly
        before the earliest of that database deadline, the Bearer token deadline and the persisted
        session deadline. Final authorization is revalidated after the evidence lock with a commit
        finalization margin. Expired, unclaimed, failed, quarantined, deletion-pending, deleted and all
