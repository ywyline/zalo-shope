      type: object
      additionalProperties: false
      description: >-
        The exchange_attribute_code is non-null exactly when allowed_types contains EXCHANGE.
        product_ids is a same-store replace-set that becomes effective only on atomic publish.
      required:
        [
          allowed_types,
          category_id,
          condition_rules,
          damaged_exception,
          exchange_attribute_code,
          exchange_same_product_only,
          expected_version,
          hygiene_restricted,
          localizations,
          product_ids,
          request_window_days,
          return_shipping_payer,
          return_window_days,
          unopened_required,
        ]
      properties:
        allowed_types:
          {
            type: array,
            minItems: 1,
            maxItems: 4,
            uniqueItems: true,
            items: { $ref: '#/components/schemas/AfterSaleType' },
          }
        category_id: { type: [string, 'null'], format: uuid }
        condition_rules: { $ref: '#/components/schemas/AfterSalePolicyConditionRules' }
        damaged_exception: { type: boolean }
        exchange_attribute_code:
          { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/PublicCode' }] }
        exchange_same_product_only: { type: boolean, const: true }
        expected_version: { type: integer, minimum: 0 }
        hygiene_restricted: { type: boolean }
        localizations: { $ref: '#/components/schemas/PolicyLocalizations' }
        product_ids:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
        request_window_days: { type: integer, minimum: 0, maximum: 365 }
        return_shipping_payer: { type: string, enum: [BUYER, MERCHANT, CONDITIONAL] }
        return_window_days: { type: integer, minimum: 1, maximum: 60 }
        unopened_required: { type: boolean }
