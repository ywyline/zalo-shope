openapi: 3.1.0
info:
  title: Zalo Shop M6 incremental API contract
  version: 0.6.1-contract
  description: >-
    M6.1 contract only. It is combined with the M1-M5 contracts and does not mean that these
    routes are implemented. Buyer store ownership comes from the authenticated member and
    X-Store-Code. Admin routes additionally require the matching store_id query parameter.
servers:
  - url: https://api.example.invalid
paths:
  /v1/after-sales/evidence-uploads:
    post:
      operationId: initializeAfterSaleEvidenceUpload
      summary: Initialize a private evidence upload for the current member and store
      security: [{ MemberBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvidenceUploadRequest' }
      responses:
        '201':
          description: Private upload target; object is unreadable until confirmed and scanned
          headers:
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
            Referrer-Policy: { $ref: '#/components/headers/NoReferrer' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceUpload' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/after-sales/evidence-uploads/{evidenceId}/confirm:
    post:
      operationId: confirmAfterSaleEvidenceUpload
      summary: Confirm object metadata and request scanning
      security: [{ MemberBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/EvidenceId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvidenceConfirmRequest' }
      responses:
        '202':
          description: Evidence is pending scanning
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/after-sales:
    get:
      operationId: listMemberAfterSales
      summary: List the current member's after-sale cases
      security: [{ MemberBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/AfterSaleType' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/AfterSaleStatus' } }
      responses:
        '200':
          description: Member-scoped cases
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AfterSalePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: createAfterSale
      summary: Submit a refund-only, return-refund, or equivalent exchange request
      description: Amount, policy result, state, refund, inventory and store facts are server-owned.
      security: [{ MemberBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AfterSaleCreateRequest' }
      responses:
        '201':
          description: Submitted case
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AfterSale' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/after-sales/{afterSaleId}:
    get:
      operationId: getMemberAfterSale
      summary: Get the current member's case and public timeline
      security: [{ MemberBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/AfterSaleId' }
      responses:
        '200':
          description: Member-safe case detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AfterSale' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/after-sales/{afterSaleId}/cancel:
    post:
      operationId: cancelMemberAfterSale
      summary: Cancel a case that is still pending review
      security: [{ MemberBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/AfterSaleId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionedReasonRequest' }
      responses:
        '200':
          description: Current case; an idempotent replay returns the same fact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AfterSale' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/after-sales/{afterSaleId}/return-shipment:
    post:
      operationId: submitAfterSaleReturnShipment
      summary: Submit buyer-provided return tracking without treating it as provider truth
      description: >-
        On the first valid submission from APPROVED, one transaction appends START_RETURN and
        RETURN_SHIPPED in order, advances the aggregate to RETURN_IN_TRANSIT and records the
        member-provided tracking fact. It must lock and win before the exclusive
        return_deadline_at; at or after that instant the request conflicts. Idempotent replay
        appends neither event again.
      security: [{ MemberBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/AfterSaleId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnShipmentRequest' }
      responses:
        '200':
          description: Case moved through an explicit return event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AfterSale' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/after-sales/{afterSaleId}/evidence/{evidenceId}:
    get:
      operationId: getMemberAfterSaleEvidence
      summary: Get a short-lived no-store URL for the current member's scanned evidence
      description: >-
        Access is issued only while the claimed object is READY and before access_expires_at.
        Expired, failed, quarantined, deletion-pending and deleted objects return the same not-found
        response. A legal hold can retain bytes but never extends this member access window.
      security: [{ MemberBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/AfterSaleId' }
        - { $ref: '#/components/parameters/EvidenceId' }
      responses:
        '200':
          description: Member-scoped private evidence access
          headers:
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
            Referrer-Policy: { $ref: '#/components/headers/NoReferrer' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceAccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/admin/orders/{orderId}/after-sales:
    post:
      operationId: createMerchantAfterSale
      summary: Create an audited merchant-initiated refund case for one order
      description: The server calculates all refundable amounts and resolves the member and store.
      security: [{ AdminBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/StoreIdQuery' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MerchantAfterSaleCreateRequest' }
      responses:
        '201':
          description: Merchant-initiated case; no refund has yet been claimed successful
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AfterSale' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/admin/after-sales:
    get:
      operationId: listAdminAfterSales
      summary: List after-sale cases for one authorized store
      security: [{ AdminBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/StoreIdQuery' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: order_id, in: query, schema: { type: string, format: uuid } }
        - { name: member_id, in: query, schema: { type: string, format: uuid } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/AfterSaleType' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/AfterSaleStatus' } }
      responses:
        '200':
          description: Store-scoped cases; evidence content is not included
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AfterSalePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/admin/after-sales/{afterSaleId}:
    get:
      operationId: getAdminAfterSale
      summary: Read one store-scoped case without private evidence bytes
      security: [{ AdminBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/StoreIdQuery' }
        - { $ref: '#/components/parameters/AfterSaleId' }
      responses:
        '200':
          description: Admin case detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AfterSale' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/admin/after-sales/{afterSaleId}/review:
    post:
      operationId: reviewAfterSale
      summary: Approve or reject after policy and order fact checks
      description: >-
        This initial review command accepts only a non-legacy case in PENDING_REVIEW and appends
        APPROVE or REJECT. A case created directly in REVIEW_REQUIRED because its order lacks a
        trustworthy policy snapshot must use resolve-review with LEGACY_APPROVE or LEGACY_REJECT;
        the two paths cannot be interchanged.
      security: [{ AdminBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/StoreIdQuery' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/AfterSaleId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AfterSaleReviewRequest' }
      responses:
        '200':
          description: Reviewed case
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AfterSale' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/admin/after-sales/{afterSaleId}/inspect-return:
    post:
      operationId: inspectAfterSaleReturn
      summary: Record received, restockable, quarantine or scrap quantities
      description: >-
        One transaction first appends RETURN_RECEIVED and then derives ACCEPT_INSPECTION only when
        at least one unit is accepted. A complete all-RETURN_TO_MEMBER inspection derives
        REJECT_INSPECTION and cannot enter refund or exchange processing. The client cannot select
        either transition event; idempotent replay appends neither event again. Any
        RESTOCK_SELLABLE quantity dynamically requires both after-sales inspect and inventory-adjust
        permission plus recent MFA; otherwise no inspection or inventory fact is committed.
      security: [{ AdminBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/StoreIdQuery' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/AfterSaleId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AfterSaleInspectionRequest' }
      responses:
        '200':
          description: Inspection and any exactly-once inventory action committed atomically
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AfterSale' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/admin/after-sales/{afterSaleId}/refund:
    post:
      operationId: requestAfterSaleRefund
      summary: Request server-calculated ONLINE or COD settlement
      description: >-
        ONLINE reuses the M5 refund capacity and outbox. COD creates a pending dual-control
        settlement and is never immediately marked successful. The server branches only from the
        trusted order payment method: ONLINE requires after-sales review plus M5 refund-create
        permission; COD requires the independent COD-refund-request permission. The client cannot
        select the payment branch. From APPROVED, both branches first append QUEUE_REFUND. ONLINE
        then atomically creates the M5 refund/outbox fact and appends REFUND_REQUESTED; a
        return-refund already at REFUND_PENDING appends only REFUND_REQUESTED. COD remains at
        REFUND_PENDING until independently confirmed. Idempotent replay appends no duplicate event.
      security: [{ AdminBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/StoreIdQuery' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/AfterSaleId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AfterSaleRefundRequest' }
      responses:
        '202':
          description: >-
            Refund or COD settlement is pending; no client amount is accepted. The returned
            settlements include the public_number required by the separate COD confirmation route.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AfterSale' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/admin/after-sales/{afterSaleId}/exchange:
    post:
      operationId: createAfterSaleExchange
      summary: Reserve and start an equal-quantity replacement SKU fulfillment
      security: [{ AdminBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/StoreIdQuery' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/AfterSaleId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AfterSaleExchangeRequest' }
      responses:
        '202':
          description: Replacement inventory is reserved or the command failed closed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AfterSale' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/admin/after-sales/{afterSaleId}/convert-exchange-to-refund:
    post:
      operationId: convertAfterSaleExchangeToRefund
      summary: Convert an inspected exchange to a refund before replacement fulfillment starts
      description: >-
        Requires after-sales exchange plus review permission and recent MFA. The server proves no
        replacement shipment or unreleased reservation exists, appends CONVERT_EXCHANGE_TO_REFUND
        and keeps all return, inspection and inventory history. A later refund command applies the
        trusted ONLINE/COD branch and permissions; this command cannot submit an amount.
      security: [{ AdminBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/StoreIdQuery' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/AfterSaleId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AfterSaleExchangeToRefundRequest' }
      responses:
        '200':
          description: Exchange converted to REFUND_PENDING without losing prior facts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AfterSale' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/admin/after-sales/{afterSaleId}/resolve-review:
    post:
      operationId: resolveAfterSaleManualReview
      summary: Resolve an uncertain fact or make the one-time decision for a legacy-policy case
      description: >-
        RESUME records RESUME_REVIEW and returns only to the stored type-compatible resume state.
        REJECT records REJECT_REVIEW and is allowed only from APPROVED/RETURN_PENDING after the
        server proves there are no fund, in-transit return, inspection, inventory or exchange facts.
        LEGACY_APPROVE/LEGACY_REJECT are accepted only for a newly created REVIEW_REQUIRED case with
        legacy_policy_review=true and no prior side effects, record a distinct append-only decision,
        and can execute exactly once. Legacy approval never backfills a current policy as historical;
        it freezes the reviewed policy basis and, for return-refund/exchange, the submitted one-time
        return window and shipping payer. The server rejects non-null return terms for non-return
        types and requires them for return-refund/exchange. policy_basis is an audited reference to
        reviewed archival rules, not a field for raw evidence, account data or payment details.
      security: [{ AdminBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/StoreIdQuery' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/AfterSaleId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AfterSaleReviewResolveRequest' }
      responses:
        '200':
          description: Case resumed or given its one-time legacy decision after audited validation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AfterSale' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/admin/after-sales/{afterSaleId}/cod-refunds/{settlementNumber}/confirm:
    post:
      operationId: confirmAfterSaleCodRefund
      summary: Independently confirm a COD refund without accepting client amount or payout reference
      description: >-
        This command is available only after an approved payout adapter or finance workflow has
        written an encrypted proof fact. The API cannot create that proof or mark an unsupported
        transfer successful. After proving different initiating/confirming actors and authoritative
        transfer evidence, one transaction marks the settlement successful and appends
        REFUND_REQUESTED then REFUND_SUCCEEDED, ending at REFUNDED. Replay returns the same facts
        without new transitions. settlementNumber is the public_number returned by the refund
        command; the server resolves and locks it only within the supplied store and after-sale case.
      security: [{ AdminBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/StoreIdQuery' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/AfterSaleId' }
        - { $ref: '#/components/parameters/SettlementNumber' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AfterSaleCodRefundConfirmRequest' }
      responses:
        '200':
          description: COD settlement confirmed by a different authorized administrator
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AfterSale' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/admin/after-sales/{afterSaleId}/evidence/{evidenceId}:
    get:
      operationId: getAdminAfterSaleEvidence
      summary: Audit and issue short-lived access to one scanned private evidence object
      description: >-
        Access is issued only for READY evidence before access_expires_at. Expired, failed,
        quarantined, deletion-pending and deleted objects are not readable through this route.
        A legal hold retains bytes for the governed compliance process but does not extend ordinary
        after-sales access; every successful administrator read remains audited.
      security: [{ AdminBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/StoreIdQuery' }
        - { $ref: '#/components/parameters/AfterSaleId' }
        - { $ref: '#/components/parameters/EvidenceId' }
      responses:
        '200':
          description: Access URL; the read is separately audited
          headers:
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
            Referrer-Policy: { $ref: '#/components/headers/NoReferrer' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceAccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/admin/after-sale-settings:
    get:
      operationId: getAfterSaleSettings
      summary: Read current-store policy readiness and enforcement state
      security: [{ AdminBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/StoreIdQuery' }
      responses:
        '200':
          description: Store-scoped policy snapshot readiness
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AfterSaleSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: setAfterSalePolicyEnforcement
      summary: Enable or disable policy snapshot enforcement for one store
      description: >-
        Enabling runs the full current-store readiness preflight atomically and fails closed when
        the default active version, assignments or checkout snapshot write are not ready.
      security: [{ AdminBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/StoreIdQuery' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AfterSaleSettingsEnforcementRequest' }
      responses:
        '200':
          description: Audited current enforcement state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AfterSaleSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/admin/after-sale-policies:
    get:
      operationId: listAfterSalePolicies
      summary: List current-store policy heads without mutable published payloads
      security: [{ AdminBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/StoreIdQuery' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: status, in: query, schema: { type: string, enum: [DRAFT, ACTIVE, DISABLED] } }
      responses:
        '200':
          description: Policy heads
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AfterSalePolicyPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/admin/after-sale-policies/{policyCode}:
    get:
      operationId: getAfterSalePolicy
      summary: Read a policy draft/head and immutable version metadata
      security: [{ AdminBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/StoreIdQuery' }
        - {
            name: policyCode,
            in: path,
            required: true,
            schema: { $ref: '#/components/schemas/PublicCode' },
          }
      responses:
        '200':
          description: Store-scoped policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AfterSalePolicyDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: putAfterSalePolicyDraft
      summary: Create or replace one store-scoped policy draft
      security: [{ AdminBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/StoreIdQuery' }
        - {
            name: policyCode,
            in: path,
            required: true,
            schema: { $ref: '#/components/schemas/PublicCode' },
          }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AfterSalePolicyDraft' }
      responses:
        '200':
          description: Draft only; it is not effective until published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AfterSalePolicyDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/admin/after-sale-policies/{policyCode}/versions:
    get:
      operationId: listAfterSalePolicyVersions
      summary: List immutable current-store policy versions
      security: [{ AdminBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/StoreIdQuery' }
        - { $ref: '#/components/parameters/PolicyCode' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Immutable policy history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AfterSalePolicyVersionPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/admin/after-sale-policies/{policyCode}/versions/{versionNumber}:
    get:
      operationId: getAfterSalePolicyVersion
      summary: Read one immutable current-store policy version and its frozen content
      security: [{ AdminBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/StoreIdQuery' }
        - { $ref: '#/components/parameters/PolicyCode' }
        - { $ref: '#/components/parameters/PolicyVersionNumber' }
      responses:
        '200':
          description: Immutable policy version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AfterSalePolicyVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/admin/after-sale-policies/{policyCode}/publish:
    post:
      operationId: publishAfterSalePolicy
      summary: Publish an immutable after-sale policy version
      description: >-
        The transaction locks canonical target keys and returns 409 when another ACTIVE policy
        already owns the same store product, category or store-default target. It atomically writes
        the immutable version, replaces only this policy's active assignment projection and audits
        the publish; timestamp or last-writer ordering never resolves overlap.
      security: [{ AdminBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/StoreIdQuery' }
        - { $ref: '#/components/parameters/PolicyCode' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyPublishRequest' }
      responses:
        '200':
          description: Published immutable version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AfterSalePolicyVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/admin/after-sale-policies/{policyCode}/disable:
    post:
      operationId: disableAfterSalePolicy
      summary: Disable a policy for new resolution without changing historical versions
      description: >-
        The server rejects disabling the enforced store default or any policy whose removal would
        make current-store snapshot resolution not ready. Historical versions remain immutable.
      security: [{ AdminBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/StoreIdQuery' }
        - { $ref: '#/components/parameters/PolicyCode' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyDisableRequest' }
      responses:
        '200':
          description: Disabled policy head; historical snapshots and versions remain readable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AfterSalePolicySummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/members/me/favorites:
    get:
      operationId: listMemberFavorites
      summary: List product favorites for the current member and store
      security: [{ MemberBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Locale' }
      responses:
        '200':
          description: Favorites; unavailable products have a restricted summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberProductPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/members/me/commerce-summary:
    get:
      operationId: getMemberCommerceSummary
      summary: Aggregate counts only; detailed facts remain in existing member APIs
      security: [{ MemberBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
      responses:
        '200':
          description: Current member and store summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberCommerceSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/members/me/favorites/{productCode}:
    put:
      operationId: putMemberFavorite
      summary: Idempotently add a current-store product favorite
      security: [{ MemberBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/ProductCode' }
      responses:
        '204': { description: Favorite exists }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteMemberFavorite
      summary: Idempotently remove a current-store product favorite
      security: [{ MemberBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/ProductCode' }
      responses:
        '204': { description: Favorite is absent }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/members/me/product-history:
    get:
      operationId: listMemberProductHistory
      summary: List the current member's most recent 100 viewed products
      security: [{ MemberBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Locale' }
      responses:
        '200':
          description: Member product history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberProductPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      operationId: clearMemberProductHistory
      summary: Delete all current-store product history for the member
      security: [{ MemberBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '204': { description: History is empty }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/members/me/product-history/{productCode}:
    put:
      operationId: touchMemberProductHistory
      summary: Idempotently update the last viewed time after a successful product render
      security: [{ MemberBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/ProductCode' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '204': { description: History was updated and bounded }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteMemberProductHistoryItem
      summary: Remove one current-store product from history
      security: [{ MemberBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/ProductCode' }
      responses:
        '204': { description: History item is absent }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/members/me/privacy-requests:
    get:
      operationId: listMemberPrivacyRequests
      summary: List the current member's real privacy intake facts and current status
      security: [{ MemberBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Privacy requests scoped to the current member and store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivacyRequestPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createMemberPrivacyRequest
      summary: Persist a privacy request intake without claiming that fulfillment is complete
      security: [{ MemberBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrivacyRequestCreateRequest' }
      responses:
        '201':
          description: A SUBMITTED privacy request fact; fulfillment remains an audited later process
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivacyRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/members/me/privacy-requests/{requestNumber}:
    get:
      operationId: getMemberPrivacyRequest
      summary: Get one current-member privacy request by its public number
      security: [{ MemberBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/PrivacyRequestNumber' }
      responses:
        '200':
          description: Current audited status without internal notes or other-member facts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivacyRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/members/me/privacy-requests/{requestNumber}/cancel:
    post:
      operationId: cancelMemberPrivacyRequest
      summary: Cancel a request only while its audited state still permits cancellation
      security: [{ MemberBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/PrivacyRequestNumber' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrivacyRequestCancelRequest' }
      responses:
        '200':
          description: Request is CANCELLED or the idempotent current fact is returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivacyRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/shares:
    post:
      operationId: createShareLink
      summary: Create an opaque, store-bound share link from a published target
      description: The client cannot provide a URL, title, image, member ID or store ID.
      security: [{ MemberBearer: [] }, {}]
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShareCreateRequest' }
      responses:
        '201':
          description: Server-resolved card and links
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareCreation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/shares/{shortCode}:
    get:
      operationId: resolveShareLink
      summary: Resolve an opaque share link to a safe Mini App and browser target
      security: []
      parameters:
        - { $ref: '#/components/parameters/ShortCode' }
        - { $ref: '#/components/parameters/Locale' }
      responses:
        '200':
          description: Published target or safe store-home fallback
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareCard' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/shares/{shortCode}/outcome:
    post:
      operationId: recordShareOutcome
      summary: Record a user-driven share-sheet completion or cancellation
      description: >-
        The signed interaction token is issued only by share creation and is bound to the short
        code, initial interaction and expiry. Outcomes are idempotent analytics facts and never
        authorize rewards, commission, redirects or financial changes.
      security: []
      parameters:
        - { $ref: '#/components/parameters/StoreCode' }
        - { $ref: '#/components/parameters/ShortCode' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShareOutcomeRequest' }
      responses:
        '204': { description: Outcome recorded or idempotently replayed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /s/{shortCode}:
    get:
      operationId: renderShareFallback
      summary: Render escaped OG metadata and an explicit open-in-Zalo action
      security: []
      parameters:
        - { $ref: '#/components/parameters/ShortCode' }
      responses:
        '200':
          description: >-
            CSP-protected browser fallback with an explicit open action; no Location header,
            meta refresh or request-controlled redirect is permitted
          headers:
            Content-Security-Policy: { $ref: '#/components/headers/FallbackCsp' }
            X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
            Referrer-Policy: { $ref: '#/components/headers/NoReferrer' }
            Cache-Control: { $ref: '#/components/headers/PublicFallbackCache' }
          content:
            text/html:
              schema: { type: string }
        '404':
          description: Unknown code renders a static safe chooser without Location or meta refresh
          headers:
            Content-Security-Policy: { $ref: '#/components/headers/FallbackCsp' }
            X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
            Referrer-Policy: { $ref: '#/components/headers/NoReferrer' }
            Cache-Control: { $ref: '#/components/headers/PublicFallbackCache' }
components:
  securitySchemes:
    MemberBearer:
      type: http
      scheme: bearer
      bearerFormat: ZaloShopMemberToken
    AdminBearer:
      type: http
      scheme: bearer
      bearerFormat: ZaloShopAdminToken
  parameters:
    StoreCode:
      name: X-Store-Code
      in: header
      required: true
      schema: { type: string, minLength: 2, maxLength: 64, pattern: '^[a-z][a-z0-9-]*$' }
    StoreIdQuery:
      name: store_id
      in: query
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[!-~]+$' }
    AfterSaleId:
      name: afterSaleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EvidenceId:
      name: evidenceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SettlementNumber:
      name: settlementNumber
      in: path
      required: true
      schema: { type: string, pattern: '^AST-[A-Z0-9]{16,32}$' }
    ProductCode:
      name: productCode
      in: path
      required: true
      schema: { $ref: '#/components/schemas/PublicCode' }
    PolicyCode:
      name: policyCode
      in: path
      required: true
      schema: { $ref: '#/components/schemas/PublicCode' }
    PolicyVersionNumber:
      name: versionNumber
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ShortCode:
      name: shortCode
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ShortCode' }
    PrivacyRequestNumber:
      name: requestNumber
      in: path
      required: true
      schema: { type: string, pattern: '^PRV-[A-Z0-9]{16,32}$' }
    Cursor:
      name: cursor
      in: query
      description: Signed opaque cursor bound to the authenticated store, member/admin scope and sort key
      schema: { $ref: '#/components/schemas/OpaqueCursor' }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Locale:
      name: locale
      in: query
      schema: { type: string, enum: [vi, zh, en], default: vi }
  schemas:
    OpaqueCursor:
      type: string
      minLength: 23
      maxLength: 512
      pattern: '^c1_[A-Za-z0-9_-]{20,509}$'
    ShortCode:
      type: string
      minLength: 20
      maxLength: 128
      pattern: '^[A-Za-z0-9_-]+$'
    HttpsUrl:
      type: string
      format: uri
      pattern: '^https://'
    MiniAppPath:
      type: string
      pattern: '^/(?:\?locale=(?:vi|zh|en)|(?:brands|categories|products|promotions|coupons)/[a-z0-9]+(?:-[a-z0-9]+)*\?locale=(?:vi|zh|en))$'
    PublicCode:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
    AfterSaleType:
      type: string
      enum: [REFUND_ONLY, RETURN_REFUND, EXCHANGE, MERCHANT_REFUND]
    AfterSaleStatus:
      type: string
      enum:
        [
          PENDING_REVIEW,
          APPROVED,
          REJECTED,
          CANCELLED,
          RETURN_PENDING,
          RETURN_IN_TRANSIT,
          INSPECTION_PENDING,
          REFUND_PENDING,
          REFUND_PROCESSING,
          REFUNDED,
          EXCHANGE_PENDING,
          EXCHANGE_IN_TRANSIT,
          REVIEW_REQUIRED,
          COMPLETED,
        ]
    EvidenceUploadRequest:
      type: object
      additionalProperties: false
      required: [byte_size, checksum_sha256, filename, mime_type]
      properties:
        byte_size: { type: integer, minimum: 1, maximum: 52428800 }
        checksum_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        filename: { type: string, minLength: 1, maxLength: 255, pattern: '^[^/\\]+$' }
        mime_type: { type: string, enum: [image/jpeg, image/png, image/webp, video/mp4] }
      allOf:
        - if:
            properties:
              mime_type: { enum: [image/jpeg, image/png, image/webp] }
          then:
            properties:
              byte_size: { maximum: 10485760 }
    EvidenceUpload:
      type: object
      additionalProperties: false
      required: [evidence_id, upload_url, expires_at, version]
      properties:
        evidence_id: { type: string, format: uuid }
        upload_url: { $ref: '#/components/schemas/HttpsUrl' }
        expires_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    EvidenceConfirmRequest:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version: { type: integer, minimum: 1 }
    EvidenceView:
      type: object
      additionalProperties: false
      description: >-
        Safe public projection. Internal scan, quarantine and deletion states are collapsed into
        UNAVAILABLE so member and ordinary admin responses cannot reveal cleanup or security detail.
      required: [evidence_id, status, access_expires_at, version]
      properties:
        evidence_id: { type: string, format: uuid }
        status:
          type: string
          enum: [PENDING, READY, UNAVAILABLE]
        access_expires_at:
          type: [string, 'null']
          format: date-time
          description: >-
            Exclusive ordinary-access deadline; null when unavailable. A legal hold never extends it.
        version: { type: integer, minimum: 1 }
    EvidenceAccess:
      type: object
      additionalProperties: false
      required: [url, expires_at]
      properties:
        url: { $ref: '#/components/schemas/HttpsUrl' }
        expires_at: { type: string, format: date-time }
    AfterSaleStandardItemInput:
      type: object
      additionalProperties: false
      required: [order_item_id, quantity]
      properties:
        order_item_id: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 1000 }
    AfterSaleExchangeItemInput:
      type: object
      additionalProperties: false
      required: [order_item_id, quantity, replacement_sku_id]
      properties:
        order_item_id: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 1000 }
        replacement_sku_id: { type: string, format: uuid }
    RefundOnlyCreateRequest:
      type: object
      additionalProperties: false
      required: [description, evidence_ids, items, order_id, reason_code, type]
      properties:
        description: { type: string, minLength: 10, maxLength: 2000 }
        evidence_ids:
          { type: array, maxItems: 6, uniqueItems: true, items: { type: string, format: uuid } }
        items:
          {
            type: array,
            minItems: 1,
            maxItems: 20,
            items: { $ref: '#/components/schemas/AfterSaleStandardItemInput' },
          }
        order_id: { type: string, format: uuid }
        reason_code: { $ref: '#/components/schemas/PublicCode' }
        type: { type: string, const: REFUND_ONLY }
    ReturnRefundCreateRequest:
      type: object
      additionalProperties: false
      required: [description, evidence_ids, items, order_id, reason_code, type]
      properties:
