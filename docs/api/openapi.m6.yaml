        status: { type: string, enum: [DRAFT, ACTIVE, DISABLED] }
        current_version_number: { type: [integer, 'null'], minimum: 1 }
        version: { type: integer, minimum: 1 }
    AfterSalePolicyDetail:
      type: object
      additionalProperties: false
      required: [code, status, current_version_number, draft, current_version, version]
      properties:
        code: { $ref: '#/components/schemas/PublicCode' }
        status: { type: string, enum: [DRAFT, ACTIVE, DISABLED] }
